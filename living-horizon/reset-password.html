<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password · Living Horizon Training</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lh.css">
<script src="runtime-config.js"></script>
<script src="lh-api.js"></script>
<script src="lh-shell.js" data-roles="public" data-nav="none" data-foot="none"></script>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:440px}
  h1{font-family:var(--lh-display);font-weight:500;font-size:28px;margin:14px 0 4px}
  .sub{color:var(--lh-muted);font-size:13.5px;margin:0 0 20px}
  #err,#ok{display:none;margin-bottom:14px}
</style>
</head>
<body>
<div class="card lh-card">
  <a class="lh-brand" href="index.html" style="color:var(--lh-ink)"><span class="lh-mark"></span><span><b data-lh-brand>Living Horizon</b><small style="color:var(--lh-muted)">Staff training</small></span></a>
  <h1>Choose a new password</h1>
  <p class="sub">This link works once and for 60 minutes from when it was sent.</p>
  <div id="err" class="lh-note err"></div>
  <div id="ok" class="lh-note ok">Password reset. <a href="index.html">Sign in</a> with it now.</div>
  <form id="f">
    <div class="lh-field"><label class="lh-label" for="newPw">New password</label><input class="lh-input" id="newPw" type="password" autocomplete="new-password" required><div class="lh-help">At least 10 characters, with upper and lower case letters and a digit.</div></div>
    <div class="lh-field"><label class="lh-label" for="confirmPw">Confirm new password</label><input class="lh-input" id="confirmPw" type="password" autocomplete="new-password" required></div>
    <button class="lh-btn block" type="submit" id="go">Reset password</button>
  </form>
</div>
<script>
(function(){
  'use strict';
  var api=window.LH, $=function(id){return document.getElementById(id);};
  var token=new URLSearchParams(location.search).get('token')||'';
  if(!token){ $('err').textContent='This reset link is missing its token — open the link from the email again, or request a new one from the sign-in page.'; $('err').style.display='block'; }
  $('f').onsubmit=async function(ev){
    ev.preventDefault(); $('err').style.display='none';
    if($('newPw').value!==$('confirmPw').value){ $('err').textContent='The two passwords do not match.'; $('err').style.display='block'; return; }
    var b=$('go'); b.disabled=true;
    try{ await api.resetPasswordWithToken(token,$('newPw').value); $('ok').style.display='block'; $('f').style.display='none'; }
    catch(e){ $('err').textContent=e.message||'Could not reset the password.'; $('err').style.display='block'; b.disabled=false; }
  };
})();
</script>
</body>
</html>
