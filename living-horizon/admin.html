<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin console · Living Horizon Training</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lh.css">
<script src="runtime-config.js"></script>
<script src="lh-api.js"></script>
<script src="lh-shell.js" data-roles="admin" data-foot="none"></script>
<!--
  The training administrator's console. Four workspaces, each its own page
  loaded here in a frame with ?embed=1 (which drops its top bar):
    courses   — build a course: modules, policy documents, AI sessions; publish
    progress  — who is on what, how far they are, assign courses to staff
    overview  — the whole programme at a glance
    staff     — accounts: add staff, reset passwords, suspend
  The hash names the workspace (admin.html#progress) and anything after a
  ? is passed through to the page (admin.html#progress?topic=X).
-->
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column}
  .tabs{background:var(--lh-white);border-bottom:1px solid var(--lh-line);padding:0 22px;display:flex;gap:2px;align-items:flex-end;overflow-x:auto}
  .tab{border:0;background:transparent;padding:14px 16px 12px;font:600 13.5px var(--lh-sans);color:var(--lh-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--lh-ink)}
  .tab.active{color:var(--lh-teal);border-bottom-color:var(--lh-teal)}
  .tab small{display:block;font:500 10px var(--lh-mono);letter-spacing:.04em;color:var(--lh-faint);margin-top:2px}
  .frame{flex:1;min-height:0;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--lh-paper)}
</style>
</head>
<body>
<div class="tabs" id="tabs">
  <button class="tab" data-tab="courses">Courses<small>build · publish</small></button>
  <button class="tab" data-tab="progress">Learners &amp; progress<small>assign · track</small></button>
  <button class="tab" data-tab="overview">Overview<small>the whole programme</small></button>
  <button class="tab" data-tab="staff">Staff accounts<small>add · reset · suspend</small></button>
</div>
<div class="frame"><iframe id="pane" title="Admin workspace"></iframe></div>
<script>
(function(){
  'use strict';
  var PAGES={courses:'admin-courses.html',progress:'admin-progress.html',overview:'admin-overview.html',staff:'admin-staff.html'};
  var current='';
  function parse(){
    var h=(location.hash||'').replace(/^#/,''); var i=h.indexOf('?');
    return { tab:(i>=0?h.slice(0,i):h)||'courses', qs:i>=0?h.slice(i+1):'' };
  }
  function show(force){
    var p=parse(); if(!PAGES[p.tab]) p.tab='courses';
    var url=PAGES[p.tab]+'?embed=1'+(p.qs?'&'+p.qs:'');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){ b.classList.toggle('active',b.dataset.tab===p.tab); });
    if(force||url!==current){ current=url; document.getElementById('pane').src=url; }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){ b.onclick=function(){ location.hash=b.dataset.tab; }; });
  window.addEventListener('hashchange',function(){ show(false); });
  // A page inside the frame can ask to switch workspace (e.g. the topic
  // builder's "Assign to staff" opens the progress workspace on that course).
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.type==='ladAssignTopic'&&d.topic) location.hash='progress?topic='+encodeURIComponent(d.topic)+'&assign=1';
    if(d.type==='lhOpen'&&PAGES[d.tab]) location.hash=d.tab+(d.qs?'?'+d.qs:'');
  });
  show(true);
})();
</script>
</body>
</html>
