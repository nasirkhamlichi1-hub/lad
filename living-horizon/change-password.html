<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password · Living Horizon Training</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lh.css">
<script src="runtime-config.js"></script>
<script src="lh-api.js"></script>
<script src="lh-shell.js" data-roles="learner" data-nav="none" data-foot="none"></script>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:440px}
  h1{font-family:var(--lh-display);font-weight:500;font-size:28px;margin:14px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--lh-muted);font-size:13.5px;margin:0 0 20px}
  .strength{height:4px;background:var(--lh-line);border-radius:3px;margin-top:8px;overflow:hidden}
  .strength i{display:block;height:100%;width:0;background:var(--lh-red);transition:all .2s}
  .rules{font-size:11.5px;color:var(--lh-muted);margin-top:8px}
  .rules .ok{color:var(--lh-green);font-weight:600}
  #err,#ok{display:none;margin-bottom:14px}
</style>
</head>
<body>
<div class="card lh-card">
  <a class="lh-brand" href="index.html" style="color:var(--lh-ink)"><span class="lh-mark"></span><span><b data-lh-brand>Living Horizon</b><small style="color:var(--lh-muted)">Staff training</small></span></a>
  <h1>Set your password</h1>
  <p class="sub">Welcome. Choose a personal password before you continue — this only happens once.</p>
  <div id="err" class="lh-note err"></div>
  <div id="ok" class="lh-note ok">Password updated. Taking you in…</div>
  <form id="f">
    <div class="lh-field"><label class="lh-label" for="oldPw">Current (temporary) password</label><input class="lh-input" id="oldPw" type="password" autocomplete="current-password" required></div>
    <div class="lh-field"><label class="lh-label" for="newPw">New password</label><input class="lh-input" id="newPw" type="password" autocomplete="new-password" required>
      <div class="strength"><i id="bar"></i></div>
      <div class="rules"><span data-rule="len">10+ characters</span> · <span data-rule="upper">an uppercase letter</span> · <span data-rule="lower">a lowercase letter</span> · <span data-rule="digit">a digit</span></div></div>
    <div class="lh-field"><label class="lh-label" for="confirmPw">Confirm new password</label><input class="lh-input" id="confirmPw" type="password" autocomplete="new-password" required></div>
    <button class="lh-btn block" type="submit" id="go">Set password and continue</button>
  </form>
</div>
<script>
(function(){
  'use strict';
  var api=window.LH, $=function(id){return document.getElementById(id);};
  $('newPw').oninput=function(){
    var pw=this.value, checks={len:pw.length>=10,upper:/[A-Z]/.test(pw),lower:/[a-z]/.test(pw),digit:/[0-9]/.test(pw)}, n=0;
    Object.keys(checks).forEach(function(k){ var el=document.querySelector('[data-rule="'+k+'"]'); if(el) el.classList.toggle('ok',checks[k]); if(checks[k]) n++; });
    var bar=$('bar'); bar.style.width=(n*25)+'%'; bar.style.background=n<=1?'var(--lh-red)':n===2?'var(--lh-sun)':'var(--lh-green)';
  };
  $('f').onsubmit=async function(ev){
    ev.preventDefault(); $('err').style.display='none';
    if($('newPw').value!==$('confirmPw').value){ $('err').textContent='The new password and the confirmation do not match.'; $('err').style.display='block'; return; }
    var b=$('go'); b.disabled=true; b.textContent='Saving…';
    try{
      await api.changeMyPassword($('oldPw').value,$('newPw').value);
      $('ok').style.display='block';
      var next=new URLSearchParams(location.search).get('next');
      setTimeout(function(){ location.href=next||window.LHShell.home(); },700);
    }catch(e){ $('err').textContent=e.message||'Could not update the password.'; $('err').style.display='block'; b.disabled=false; b.textContent='Set password and continue'; }
  };
})();
</script>
</body>
</html>
