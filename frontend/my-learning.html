<!doctype html>
<html lang="en">
<head>
<script>/* Canonical host. The apex and www are separate origins with separate
   sign-ins and separate caches; only www serves the application. Runs first,
   inline, before any external script, so a deep link on the bare domain is
   corrected instead of booting a page whose scripts cannot load. */
(function(){if(location.hostname==='legalaffairstraining.com'){location.replace('https://www.legalaffairstraining.com'+location.pathname+location.search+location.hash);}})();</script>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="lad-admin-guard.js" data-roles="lawyer,lad_staff,lad_admin,lad_intelligence,lad_super_admin,super_admin,dg"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Learning — CLPD</title>
<!--
  The lawyer's own progress across every topic they are enrolled on.
  Designed to sit inside lawyer-portal-v2.html as a tab, and to work
  standalone: add ?embed=1 to drop the page header.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="runtime-config.js"></script>
<script src="api-client.js"></script>
<script src="auth-bridge.js"></script>
<style>
:root{
  --serif:'Instrument Serif',serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --ink:#0a0f1a; --slate:#3a4554; --slate2:#5b6878; --slate3:#8a98aa; --slate4:#aeb9c8;
  --line:#e8ecf1; --line2:#d2dae3; --paper:#f7f9fb; --paper2:#eef2f6; --white:#fff;
  --green:#9D7714; --green-l:#B08A28; --green-bg:#e6f4ee; --green-border:#26CB84;
  --gold:#9D7714; --gold-bg:#fdf6e9; --gold-border:#ead9b0;
  --red:#dc2626; --red-bg:#fef2f2; --red-border:#fecaca;
  --blue:#202A50; --blue-bg:#eef4ff; --blue-border:#c5d8f7;
  --purple:#202A50; --purple-bg:#f3e8ff; --purple-border:#d8b4fe;
  --amber:#d97706;
  --r-lg:14px; --sh-sm:0 1px 2px rgba(15,23,42,.04),0 2px 4px rgba(15,23,42,.04);
  --sh-md:0 4px 8px rgba(15,23,42,.06),0 8px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:22px 24px 60px}
html.lad-embed .page-head{display:none}
html.lad-embed body{background:transparent}

.page-head{padding:14px 0 12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:9.5px;color:var(--gold);letter-spacing:1.4px;
  text-transform:uppercase;font-weight:600;margin-bottom:3px}
.title{font-family:var(--serif);font-size:26px;letter-spacing:-.02em;margin:0 0 4px;font-weight:500;line-height:1.1}
.desc{font-size:12.5px;color:var(--slate);max-width:780px}

/* summary strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);padding:15px 17px}
.stat .v{font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .v.green{color:var(--green)}
.stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--slate3);font-weight:600;margin-top:7px}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);padding:18px 20px;margin-bottom:12px}
.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.cname{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:-.01em;flex:1;min-width:180px}
.pct{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--green);font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.fill{height:100%;background:var(--green);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.cmeta{font-family:var(--mono);font-size:10px;color:var(--slate3);letter-spacing:.3px;
  font-variant-numeric:tabular-nums;margin-bottom:12px}

.step{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:none}
.idx{font-family:var(--mono);font-size:10.5px;color:var(--slate4);min-width:20px;text-align:right;
  font-variant-numeric:tabular-nums}
.kind{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;
  padding:4px 7px;border-radius:5px;min-width:70px;text-align:center;white-space:nowrap}
.k-ai{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.k-scorm{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.k-doc{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.grow{flex:1;min-width:0}
.st{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-family:var(--mono);font-size:10px;color:var(--slate3);font-variant-numeric:tabular-nums}
.pill{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.p-not_started{background:var(--paper2);color:var(--slate3)}
.p-in_progress{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border)}
.p-completed,.p-passed{background:var(--green);color:#fff}
.p-failed{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}

.btn{background:var(--green);color:#fff;border:none;padding:8px 15px;border-radius:9px;
  font-size:12.5px;font-weight:600}
.btn:hover{background:var(--green-l)}
.btn-light{background:var(--white);border:1.5px solid var(--line2);color:var(--ink)}
.btn-light:hover{background:var(--paper)}
.empty{color:var(--slate3);font-size:13px;font-style:italic;padding:20px 0;text-align:center}
.err{background:var(--red-bg);border:1px solid var(--red-border);color:#9b1c1c;
  border-radius:10px;padding:11px 15px;font-size:12.5px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
  <!-- Government of Dubai Legal Affairs Department identity -->
  <link rel="stylesheet" href="lad-brand.css">
  <link rel="stylesheet" href="lad-rtl.css">
  <!-- Arabic interface: direction before first paint, dictionary-driven translation, language switch -->
  <script src="lad-i18n.js"></script>
  <script src="lad-brand.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">Legal Affairs Department · CLPD</div>
    <h1 class="title">My Learning</h1>
    <p class="desc">Where you have got to on every topic you are enrolled on. Completion is worked out from what you have actually finished, not from time spent.</p>
  </div>
  <div id="body"><div class="empty">Loading your progress…</div></div>
</div>

<script>
(function(){
'use strict';
var api=window.LAD, $=function(id){return document.getElementById(id);};
if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('lad-embed');

var KIND={ai_lesson:{l:'AI session',c:'k-ai'},scorm:{l:'SCORM',c:'k-scorm'},
  document:{l:'Material',c:'k-doc'},link:{l:'Material',c:'k-doc'},video:{l:'Video',c:'k-doc'}};
var LABEL={not_started:'not started',in_progress:'in progress',completed:'completed',
  passed:'passed',failed:'failed'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mins(s){return s?Math.round(s/60)+' min':'—';}

async function load(){
  var report;
  try{ report=await api.myLearningReport(); }
  catch(e){ $('body').innerHTML='<div class="err">Could not load your progress: '+esc(e.message)+'</div>'; return; }

  var enrolments=(report.enrolments||[]).filter(function(e){return e.status!=='withdrawn';});
  if(!enrolments.length){
    $('body').innerHTML='<div class="empty">You are not enrolled on any topics yet.</div>';
    return;
  }

  var totalMin=enrolments.reduce(function(n,e){return n+(e.total_seconds||0);},0);
  var finished=enrolments.filter(function(e){return e.status==='completed';}).length;
  var avg=Math.round(enrolments.reduce(function(n,e){return n+e.percent;},0)/enrolments.length);

  var html='<div class="stats">'+
    '<div class="stat"><div class="v">'+enrolments.length+'</div><div class="l">Topics enrolled</div></div>'+
    '<div class="stat"><div class="v green">'+finished+'</div><div class="l">Completed</div></div>'+
    '<div class="stat"><div class="v">'+avg+'%</div><div class="l">Average progress</div></div>'+
    '<div class="stat"><div class="v">'+Math.round(totalMin/60)+'</div><div class="l">Hours recorded</div></div>'+
  '</div>';

  // Each topic, with its steps and where the lawyer stands on each.
  for(var i=0;i<enrolments.length;i++){
    var e=enrolments[i];
    var outline;
    try{ outline=await api.courseOutline(e.course_id); }catch(err){ continue; }

    var steps=[];
    (outline.sections||[]).forEach(function(s){ steps=steps.concat(s.activities); });
    steps.sort(function(a,b){return a.position-b.position;});

    html+='<div class="card">'+
      '<div class="chead">'+
        '<div class="cname">'+esc((outline.sections[0]&&outline.sections[0].title)||e.course_id)+'</div>'+
        '<div class="pct">'+e.percent+'%</div>'+
        '<button class="btn" data-go="'+esc(e.course_id)+'">'+
          (e.status==='completed'?'Revisit':'Continue')+'</button>'+
      '</div>'+
      '<div class="track"><div class="fill" style="width:'+e.percent+'%"></div></div>'+
      '<div class="cmeta">'+e.required_done+' of '+e.required_total+' required steps · '+
        mins(e.total_seconds)+' recorded'+
        (e.completed_at?(' · finished '+esc(String(e.completed_at).slice(0,10))):'')+'</div>'+
      (e.source==='assigned'
        ?'<div class="cmeta" style="color:var(--gold)">Assigned'+(e.assigned_by_name?' by '+esc(e.assigned_by_name):'')+
          (e.due_at?' · complete by '+esc(String(e.due_at).slice(0,10)):'')+(e.note?' · '+esc(e.note):'')+'</div>'
        :'')+
      steps.map(function(a,n){
        var k=KIND[a.kind]||KIND.document, p=a.progress||{status:'not_started'};
        var bits=[];
        if(p.score!==null&&p.score!==undefined) bits.push('score '+p.score);
        if(a.pass_score) bits.push('pass '+a.pass_score);
        if(p.total_seconds) bits.push(mins(p.total_seconds));
        if(p.attempt_count) bits.push(p.attempt_count+'x');
        return '<div class="step"><span class="idx">'+(n+1)+'</span>'+
          '<span class="kind '+k.c+'">'+k.l+'</span>'+
          '<div class="grow"><div class="st" translate="no">'+esc(a.title)+'</div>'+
          '<div class="ss">'+esc(bits.join(' · '))+'</div></div>'+
          '<span class="pill p-'+p.status+'">'+LABEL[p.status]+'</span></div>';
      }).join('')+
    '</div>';
  }

  $('body').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(b){
    b.onclick=function(){ location.href='course-hub.html?topic='+encodeURIComponent(b.dataset.go); };
  });
}
load();
})();
</script>
</body>
</html>
