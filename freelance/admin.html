<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin console · Freelance Lawyers Training</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Government of Dubai Legal Affairs Department identity, then the portal's own stylesheet -->
<link rel="stylesheet" href="lad-brand.css">
<link rel="stylesheet" href="fl.css">
<link rel="stylesheet" href="lad-rtl.css">
<!-- Arabic interface: direction before first paint, dictionary-driven translation, language switch -->
<script src="lad-i18n.js"></script>
<script src="lad-brand.js" defer></script>
<script src="runtime-config.js"></script>
<script src="fl-api.js"></script>
<script src="fl-shell.js" data-roles="admin" data-foot="none"></script>
<!--
  The training administrator's console. Four workspaces, each its own page
  loaded here in a frame with ?embed=1 (which drops its top bar):
    courses   — build a course: modules, reference documents, AI sessions; publish
    progress  — who is on what, how far they are, assign courses to lawyers
    overview  — the whole programme at a glance
    lawyers     — accounts: add lawyers, reset passwords, suspend
  The hash names the workspace (admin.html#progress) and anything after a
  ? is passed through to the page (admin.html#progress?topic=X).
-->
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column}
  .tabs{background:var(--fl-white);border-bottom:1px solid var(--fl-line);padding:0 22px;display:flex;gap:2px;align-items:flex-end;overflow-x:auto}
  .tab{border:0;background:transparent;padding:14px 16px 12px;font:600 13.5px var(--fl-sans);color:var(--fl-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--fl-ink)}
  .tab.active{color:var(--fl-teal);border-bottom-color:var(--fl-teal)}
  .tab small{display:block;font:500 10px var(--fl-mono);letter-spacing:.04em;color:var(--fl-faint);margin-top:2px}
  .frame{flex:1;min-height:0;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--fl-paper)}
</style>
</head>
<body>
<div class="tabs" id="tabs">
  <button class="tab" data-tab="courses">Courses<small>build · publish</small></button>
  <button class="tab" data-tab="progress">Learners &amp; progress<small>assign · track</small></button>
  <button class="tab" data-tab="overview">Overview<small>the whole programme</small></button>
  <button class="tab" data-tab="lawyers">Lawyer accounts<small>add · reset · suspend</small></button>
</div>
<div class="frame"><iframe id="pane" title="Admin workspace"></iframe></div>
<script>
(function(){
  'use strict';
  var PAGES={courses:'admin-courses.html',progress:'admin-progress.html',overview:'admin-overview.html',lawyers:'admin-lawyers.html'};
  var current='';
  function parse(){
    var h=(location.hash||'').replace(/^#/,''); var i=h.indexOf('?');
    return { tab:(i>=0?h.slice(0,i):h)||'courses', qs:i>=0?h.slice(i+1):'' };
  }
  function show(force){
    var p=parse(); if(!PAGES[p.tab]) p.tab='courses';
    var url=PAGES[p.tab]+'?embed=1'+(p.qs?'&'+p.qs:'');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){ b.classList.toggle('active',b.dataset.tab===p.tab); });
    if(force||url!==current){ current=url; document.getElementById('pane').src=url; }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){ b.onclick=function(){ location.hash=b.dataset.tab; }; });
  window.addEventListener('hashchange',function(){ show(false); });
  // A page inside the frame can ask to switch workspace (e.g. the topic
  // builder's "Assign to lawyers" opens the progress workspace on that course).
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.type==='ladAssignTopic'&&d.topic) location.hash='progress?topic='+encodeURIComponent(d.topic)+'&assign=1';
    if(d.type==='flOpen'&&PAGES[d.tab]) location.hash=d.tab+(d.qs?'?'+d.qs:'');
  });
  show(true);
})();
</script>
</body>
</html>
