<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password · Freelance Lawyers Training</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Government of Dubai Legal Affairs Department identity, then the portal's own stylesheet -->
<link rel="stylesheet" href="lad-brand.css">
<link rel="stylesheet" href="fl.css">
<link rel="stylesheet" href="lad-rtl.css">
<!-- Arabic interface: direction before first paint, dictionary-driven translation, language switch -->
<script src="lad-i18n.js"></script>
<script src="lad-brand.js" defer></script>
<script src="runtime-config.js"></script>
<script src="fl-api.js"></script>
<script src="fl-shell.js" data-roles="public" data-nav="none" data-foot="none"></script>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:440px}
  h1{font-family:var(--fl-display);font-weight:500;font-size:28px;margin:14px 0 4px}
  .sub{color:var(--fl-muted);font-size:13.5px;margin:0 0 20px}
  #err,#ok{display:none;margin-bottom:14px}
</style>
</head>
<body>
<div class="card fl-card">
  <a class="fl-brand" href="index.html" style="color:var(--fl-ink)"><span class="fl-mark"></span><span><b data-fl-brand>Legal Affairs Department</b><small style="color:var(--fl-muted)">Freelance Lawyers Training</small></span></a>
  <h1>Choose a new password</h1>
  <p class="sub">This link works once and for 60 minutes from when it was sent.</p>
  <div id="err" class="fl-note err"></div>
  <div id="ok" class="fl-note ok">Password reset. <a href="index.html">Sign in</a> with it now.</div>
  <form id="f">
    <div class="fl-field"><label class="fl-label" for="newPw">New password</label><input class="fl-input" id="newPw" type="password" autocomplete="new-password" required><div class="fl-help">At least 10 characters, with upper and lower case letters and a digit.</div></div>
    <div class="fl-field"><label class="fl-label" for="confirmPw">Confirm new password</label><input class="fl-input" id="confirmPw" type="password" autocomplete="new-password" required></div>
    <button class="fl-btn block" type="submit" id="go">Reset password</button>
  </form>
</div>
<script>
(function(){
  'use strict';
  var api=window.FL, $=function(id){return document.getElementById(id);};
  var token=new URLSearchParams(location.search).get('token')||'';
  if(!token){ $('err').textContent='This reset link is missing its token — open the link from the email again, or request a new one from the sign-in page.'; $('err').style.display='block'; }
  $('f').onsubmit=async function(ev){
    ev.preventDefault(); $('err').style.display='none';
    if($('newPw').value!==$('confirmPw').value){ $('err').textContent='The two passwords do not match.'; $('err').style.display='block'; return; }
    var b=$('go'); b.disabled=true;
    try{ await api.resetPasswordWithToken(token,$('newPw').value); $('ok').style.display='block'; $('f').style.display='none'; }
    catch(e){ $('err').textContent=e.message||'Could not reset the password.'; $('err').style.display='block'; b.disabled=false; }
  };
})();
</script>
</body>
</html>
