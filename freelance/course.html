  // ─── The reader ─────────────────────────────────────────────────
  function readerShow(kindLabel, title) {
    $('rKind').textContent = kindLabel; $('rTitle').textContent = title;
    ['rOpen', 'rDown', 'rText', 'rOrig', 'rQuiz'].forEach(function (id) { $(id).style.display = 'none'; });
    $('rText').textContent = T('Text', 'النص'); $('rOrig').textContent = T('Original', 'الأصل');
    $('rQuiz').textContent = T('Test yourself', 'اختبر نفسك');
    $('rBody').innerHTML = '<div class="rmsg">' + T('Opening…', 'جارٍ الفتح…') + '</div>';
    $('reader').showModal();
  }
  function readerFrame(url, sandboxed) {
    var f = document.createElement('iframe');
    if (sandboxed) f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
    f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.src = url;
    $('rBody').innerHTML = ''; $('rBody').appendChild(f);
  }
  function readerNewTab(url) { var b = $('rOpen'); b.style.display = ''; b.onclick = function () { window.open(url, '_blank'); }; }
  function readerDownload(url, name) {
    var b = $('rDown'); b.style.display = '';
    b.onclick = function () { var a = document.createElement('a'); a.href = url; a.download = name || 'material'; document.body.appendChild(a); a.click(); a.remove(); };
  }
  // Tearing the reader down. Split out from the button because Escape closes a
  // modal <dialog> natively without firing any click handler — and leaving this
  // undone meant the heartbeat kept running against a sitting nobody was in,
  // booking hours that never happened onto the estate dashboard, and leaving a
  // SCORM iframe alive inside a closed dialog to report a stale finish later.
  function teardownReader() {
    $('rBody').innerHTML = '';
    if (scormSession && !scormSession.done) {
      stopHeartbeat();
      var sess = scormSession; scormSession = null;
      var seconds = Math.max(5, Math.round((Date.now() - openedAt) / 1000));
      api.closeAttempt(sess.attempt.id, { completed: false, abandoned: true, seconds: seconds })
        .catch(function () { }).then(function () { return load(); });
    }
  }
  $('rClose').onclick = function () { $('reader').close(); };
  // 'close' fires however the dialog went away — button, Escape, or .close().
  $('reader').addEventListener('close', teardownReader);

  // Fetch a material's bytes WITH the sign-in token (a plain browser tab has
  // no token, which is why raw download links used to answer "no_access").
  async function fetchMaterialBlob(courseId, mid) {
    var resp = await fetch((window.LAD_API_BASE || '') + '/api/v1/courses/' +
      encodeURIComponent(courseId) + '/materials/' + encodeURIComponent(mid) + '/download',
      { headers: api.getToken() ? { 'Authorization': 'Bearer ' + api.getToken() } : {} });
    if (!resp.ok) throw new Error('Could not open this material (' + resp.status + ')');
    return resp.blob();
  }

  async function openReference(m, courseId, opts) {
    courseId = courseId || TOPIC;
    opts = opts || {};
    if (!m) return;
    noteRead(m, courseId);
    var vid = m.kind === 'link' ? ytId(m.url) : null;
    if (vid) {
      readerShow('VIDEO', flPick(m, 'title'));
      readerFrame('https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0');
      readerNewTab(m.url);
      return;
    }
    if (m.kind === 'scorm' && m.has_file) {
      // If this package is also a step on the journey, play it through the
      // tracked path so finishing it counts — otherwise a learner who does
      // the whole thing from the library earns nothing on the ring.
      var step = spineActs.filter(function (a) { return a.kind === 'scorm' && (a.material_id === m.id || a.material_id_ar === m.id); })[0];
      if (step) { launch(step); return; }
      // An uploaded package plays inside the hub, against our own runtime.
      readerShow('INTERACTIVE', flPick(m, 'title'));
      try { readerFrame(await scormPlayerUrl(courseId, m.id)); }
      catch (e) { $('rBody').innerHTML = '<div class="rmsg">' + esc(e.message || 'Could not open the package.') + '</div>'; }
      return;
    }
    // A web link opens on its own site unless the library has actually read
    // its text — only then is there an article-by-article view to show. The
    // tab opens here, inside the click, so the browser does not block it.
    if (m.kind === 'scorm' || (m.kind === 'link' && m.indexed !== true)) {
      // External sites usually refuse to be embedded — open them properly.
      window.open(m.url, '_blank');
      return;
    }
    // A document the library can read opens as text, article by article, at
    // the article an answer cited; the original file is one click away.
    var isPdf = /pdf/i.test(m.mime || '') || /\.pdf$/i.test(m.file_name || '');
    readerShow(m.kind === 'link' ? 'PAGE' : (isPdf ? 'PDF' : 'DOC'), flPick(m, 'title'));
    if (m.indexed !== false) {
      try {
        var doc = await api.materialArticles(courseId, m.id);
        if (doc && doc.articles && doc.articles.length > 1) { readerArticles(m, courseId, doc.articles, opts.article); return; }
      } catch (e) { /* fall back to the original */ }
    }
    await openOriginal(m, courseId);
  }

  function readerArticles(m, courseId, arts, target) {
    var rtl = arts.some(function (a) { return /[؀-ۿ]/.test(a.label + ' ' + a.body.slice(0, 300)); });
    var hit = -1;
    arts.forEach(function (a, i) { if (hit < 0 && target && a.label === target) hit = i; });
    $('rBody').innerHTML = '<div class="rart"' + (rtl ? ' dir="rtl" lang="ar"' : ' dir="ltr"') + ' translate="no">' +
      '<nav class="rart-nav">' + arts.map(function (a, i) {
        return '<a href="#" data-i="' + i + '"' + (i === hit ? ' class="cited"' : '') + '>' + esc(a.label) + '</a>';
      }).join('') + '</nav>' +
      '<div class="rart-body" id="rArtBody">' + arts.map(function (a, i) {
        return '<section class="rart-a' + (i === hit ? ' hl' : '') + '" id="rart-' + i + '"><h4>' + esc(a.label) +
          (i === hit ? '<span class="lib-cited">' + T('cited in the answer', 'مُستشهد بها في الإجابة') + '</span>' : '') + '</h4>' +
          '<div class="rart-t">' + esc(a.body) + '</div></section>';
      }).join('') + '</div></div>';
    var body = $('rArtBody');
    var jump = function (i) { var sec = $('rart-' + i); if (sec) body.scrollTop = sec.offsetTop - body.offsetTop - 10; };
    $('rBody').querySelectorAll('.rart-nav a').forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); jump(Number(a.getAttribute('data-i'))); };
    });
    if (hit >= 0) requestAnimationFrame(function () { jump(hit); });
    $('rText').style.display = 'none';
    var o = $('rOrig'); o.style.display = '';
    o.onclick = function () {
      o.style.display = 'none';
      var t = $('rText'); t.style.display = '';
      t.onclick = function () { readerArticles(m, courseId, arts, target); };
      openOriginal(m, courseId);
    };
    var q = $('rQuiz'); q.style.display = '';
    q.onclick = function () { readerQuiz(m, courseId, arts); };
  }

  async function readerQuiz(m, courseId, arts) {
    $('rQuiz').style.display = 'none'; $('rOrig').style.display = 'none';
    var t = $('rText'); t.style.display = '';
    t.onclick = function () { readerArticles(m, courseId, arts); };
    $('rBody').innerHTML = '<div class="rmsg">' + T('Writing three questions on this document…', 'جارٍ إعداد ثلاثة أسئلة على هذا المستند…') + '</div>';
    var qz;
    try { qz = await api.materialQuiz(courseId, m.id, isAr() ? 'ar' : 'en'); }
    catch (e) {
      $('rBody').innerHTML = '<div class="rmsg">' + esc(/AIMODEL|configured/i.test((e && e.message) || '')
        ? T('Self-tests are not available on this server yet.', 'الاختبارات الذاتية غير متاحة على هذا الخادم بعد.')
        : T('Could not write questions on this document just now — please try again.', 'تعذّر إعداد أسئلة على هذا المستند الآن — حاول مرة أخرى.')) + '</div>';
      return;
    }
    var Q = (qz && qz.questions) || [];
    var answered = 0, right = 0;
    $('rBody').innerHTML = '<div class="rquiz"' + (isAr() ? ' dir="rtl"' : '') + '>' +
      '<h3>' + T('Test yourself', 'اختبر نفسك') + '</h3>' +
      '<p class="rq-note">' + T('Three questions from this document. Not graded — for your own practice.', 'ثلاثة أسئلة من هذا المستند. غير محتسبة — للتدرّب فقط.') + '</p>' +
      Q.map(function (q, i) {
        return '<div class="rq"><b>' + (i + 1) + '. ' + esc(q.q) + '</b>' +
          q.options.map(function (o, j) { return '<button type="button" class="rq-opt" data-q="' + i + '" data-j="' + j + '">' + esc(o) + '</button>'; }).join('') +
          '<div class="rq-why" id="rq-why-' + i + '"></div></div>';
      }).join('') + '<p class="rq-score" id="rqScore"></p></div>';
    $('rBody').querySelectorAll('.rq-opt').forEach(function (b) {
      b.onclick = function () {
        var qi = Number(b.getAttribute('data-q')), q = Q[qi];
        var ok = Number(b.getAttribute('data-j')) === q.answer;
        $('rBody').querySelectorAll('.rq-opt[data-q="' + qi + '"]').forEach(function (o) {
          o.disabled = true;
          if (Number(o.getAttribute('data-j')) === q.answer) o.classList.add('right');
        });
        if (!ok) b.classList.add('wrong'); else right++;
        answered++;
        var why = $('rq-why-' + qi);
        why.innerHTML = (ok ? T('Correct. ', 'إجابة صحيحة. ') : T('Not quite. ', 'ليس تماماً. ')) + esc(q.why || '') +
          (q.article ? ' <button type="button" class="lx-link" data-art="' + esc(q.article) + '">' + T('Read ', 'اقرأ ') + esc(q.article) + '</button>' : '');
        var link = why.querySelector('[data-art]');
        if (link) link.onclick = function () { readerArticles(m, courseId, arts, link.getAttribute('data-art')); };
        if (answered === Q.length) {
          $('rqScore').textContent = isAr() ? ('أجبت إجابة صحيحة عن ' + right + ' من ' + Q.length + '.') : ('You got ' + right + ' of ' + Q.length + ' right.');
        }
      };
    });
  }

  // The material as it was uploaded or linked: the PDF itself, the file, or the page.
  async function openOriginal(m, courseId) {
    $('rBody').innerHTML = '<div class="rmsg">' + T('Opening…', 'جارٍ الفتح…') + '</div>';
    if (m.kind === 'link') {
      $('rBody').innerHTML = '<div class="rmsg"><div>' + T('This page opens on its own site.', 'تُفتح هذه الصفحة على موقعها.') +
        '<br><br><button id="rGoLink">' + T('Open the page', 'افتح الصفحة') + '</button></div></div>';
      $('rGoLink').onclick = function () { window.open(m.url, '_blank'); };
      readerNewTab(m.url);
      return;
    }
    // A file: inline (fetch with the token) or cloud blob (short-lived URL).
    var isPdf = /pdf/i.test(m.mime || '') || /\.pdf$/i.test(m.file_name || '');
    var isText = /^text\/|json|html/i.test(m.mime || '');
    try {
      if (m.download_kind === 'blob') {
        var u = await api.materialDownloadUrl(courseId, m.id);
        if (isPdf) { readerFrame(u.url); } else { $('rBody').innerHTML = '<div class="rmsg">This file opens outside the hub.</div>'; }
        readerNewTab(u.url); readerDownload(u.url, m.file_name || m.title);
        return;
      }
      var blob = await fetchMaterialBlob(courseId, m.id);
      var typed = new Blob([blob], { type: m.mime || 'application/octet-stream' });
      var url = URL.createObjectURL(typed);
      if (isPdf) { readerFrame(url); }
      else if (isText) {
        var txt = await typed.text();
        var d = document.createElement('div'); d.className = 'rtext'; d.textContent = txt;
        $('rBody').innerHTML = ''; $('rBody').appendChild(d);
      } else {
        $('rBody').innerHTML = '<div class="rmsg">This document type doesn’t preview in the browser — use Download and open it on your device.</div>';
      }
      readerNewTab(url); readerDownload(url, m.file_name || m.title);
    } catch (e) {
      $('rBody').innerHTML = '<div class="rmsg">' + esc(e.message || 'Could not open this material.') + '</div>';
    }
  }

  // ─── SCORM, played in the hub ───────────────────────────────────
  // The backend unzips the uploaded package and serves it with a SCORM
  // runtime of its own; this page just frames the player and listens for
  // what the package reports. The attempt opened here is settled from the
  // package's own status and score — no more "tell the page when you have
  // finished it".
  async function scormPlayerUrl(courseId, mid) {
    var resp = await fetch((window.LAD_API_BASE || '') + '/api/v1/scorm/' +
      encodeURIComponent(courseId) + '/' + encodeURIComponent(mid) + '/launch',
      { method: 'POST', headers: api.getToken() ? { 'Authorization': 'Bearer ' + api.getToken() } : {} });
    var j = null; try { j = await resp.json(); } catch (e) { }
    if (!resp.ok) {
      var err = new Error((j && j.message) || 'Could not open the package (' + resp.status + ')');
      err.link = j && j.url; throw err;
    }
    return (window.LAD_API_BASE || '') + j.player_url;
  }

  var scormSession = null;
  var spineActs = [];
  window.addEventListener('message', async function (ev) {
    var d = ev.data && ev.data.ladScorm;
    if (!d) return;
    // A package played from the reference library has no attempt to close,
    // but the player has already saved the learner's result server-side —
    // so on finish, close the reader and redraw the library so the tick shows.
    if (!scormSession) {
      if (d.event === 'finish') { $('rBody').innerHTML = ''; try { $('reader').close(); } catch (e) { } try { await loadLibrary(); } catch (e) { } }
      return;
    }
    var apiOrigin; try { apiOrigin = new URL(window.LAD_API_BASE || location.href).origin; } catch (e) { apiOrigin = location.origin; }
    if (ev.origin !== apiOrigin) return;
    if (d.event === 'finish' && !scormSession.done) {
      scormSession.done = true;
      stopHeartbeat();
      var sess = scormSession; scormSession = null;
      try {
        await api.closeAttempt(sess.attempt.id, {
          completed: !!d.completed,
          score: d.score == null ? undefined : d.score,
          percent: d.percent == null ? null : d.percent,
          seconds: d.seconds || Math.max(5, Math.round((Date.now() - openedAt) / 1000)),
        });
      } catch (e) { /* the state is saved server-side either way */ }
      $('rBody').innerHTML = ''; try { $('reader').close(); } catch (e) { }
      note(''); await load();
    }
  });

  // ─── Keeping the record while the learner works ─────────────────
  // Someone who opens a reading and then closes the laptop used to leave an
  // attempt open forever and lose every second of it. The heartbeat banks the
  // time as it accrues, so whatever happens to the tab, the record already
  // reflects the work. It reports time only — a client is never trusted to
  // say an activity was completed.
  var beat = null;
  function elapsed() { return Math.max(0, Math.round((Date.now() - openedAt) / 1000)); }

  function sendBeat() {
    if (!openAttempt) return;
    // Fire and forget. A dropped heartbeat costs at most one interval of
    // recorded time and must never surface an error over the learner's work.
    try { api.checkpoint(openAttempt.id, { seconds: elapsed() }).catch(function () {}); }
    catch (e) { /* offline, sleeping, navigating away */ }
  }

  function startHeartbeat() {
    stopHeartbeat();
    beat = setInterval(sendBeat, 30000);
  }
  function stopHeartbeat() { if (beat) { clearInterval(beat); beat = null; } }

  // The tab going away is the case this exists for, and it is the one moment
  // no interval will fire. visibilitychange is the event that actually
  // survives a phone locking or a tab closing; pagehide covers the rest.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') sendBeat();
  });
  window.addEventListener('pagehide', sendBeat);

  // ─── Launching ──────────────────────────────────────────────────
  // The AI trainer runs its own session and the server mirrors it onto the
  // spine, so this page must NOT also open an attempt for it — that would
  // double-count. Everything else is tracked from here.
  async function launch(a) {
    if (a.kind === 'ai_lesson') {
      if (!a.lesson_id) { note('This session has no teaching material attached yet.', true); return; }
      location.href = 'trainer.html?lesson=' + encodeURIComponent(a.lesson_id) +
                      '&return=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    current = a; openedAt = Date.now(); openAttempt = null; dlgHandled = false;
    try {
      var started = await api.startActivity(a.id, {});
      openAttempt = started.attempt;
      startHeartbeat();
    } catch (e) { note('Could not start this activity: ' + esc(e.message), true); return; }

    var stepMat = flMat(a);
    if (a.kind === 'scorm' && stepMat) {
      try {
        var pUrl = await scormPlayerUrl(a.course_id || TOPIC, stepMat);
        scormSession = { attempt: openAttempt, activity: a, done: false };
        readerShow('MODULE', flPick(a, 'title'));
        readerFrame(pUrl);
        return;
      } catch (e) { /* a link-only package falls through to the old flow */ }
    }

    $('dlgTitle').textContent = flPick(a, 'title');
    $('dlgBody').innerHTML = a.kind === 'scorm'
      ? 'Opens the module in a new tab — mark it done here when you have finished it.'
      : 'Opens in a new tab. Mark it done when you have read it and the time you spent is recorded.';
    $('dlg').showModal();
  }

  async function openMaterial() {
    if (!current) return;
    var wantMat = flMat(current);
    if (!wantMat) { note('No file is attached to this item yet.', true); return; }
    // Open through the reader with the sign-in token attached — a bare tab
    // has no token, so the old direct link answered {"error":"no_access"}.
    try {
      var r = await api.listCourseMaterials(current.course_id || TOPIC);
      var m = ((r && r.materials) || []).filter(function (x) { return x.id === wantMat; })[0];
      if (m) { openReference(m, current.course_id || TOPIC); return; }
    } catch (e) { /* fall through to the direct URL */ }
    try {
      var u = await api.materialDownloadUrl(current.course_id || TOPIC, wantMat);
      if (u && u.url) { window.open(u.url, '_blank'); return; }
    } catch (e2) {}
    note('Could not open this material.', true);
  }

  // Whether this sitting has already been settled, so the dialog's own 'close'
  // event does not settle it a second time. finish() closes the dialog, which
  // fires 'close', which would otherwise abandon the attempt it just completed.
  var dlgHandled = false;

  async function finish() {
    stopHeartbeat();
    dlgHandled = true;
    if (!openAttempt) { $('dlg').close(); return; }
    var seconds = Math.max(30, elapsed());
    try {
      await api.closeAttempt(openAttempt.id, { completed: true, seconds: seconds });
      $('dlg').close(); note('');
      await load();
    } catch (e) {
      // The close failed, so nothing was settled — let the dialog's own close
      // path settle it rather than silently dropping the sitting.
      dlgHandled = false;
      note('Could not record that: ' + esc(e.message), true);
    }
  }
  async function abandon() {
    stopHeartbeat();
    dlgHandled = true;
    if (openAttempt) {
      var seconds = Math.max(5, elapsed());
      try { await api.closeAttempt(openAttempt.id, { completed: false, abandoned: true, seconds: seconds }); }
      catch (e) { /* the reaper settles it later; the heartbeat kept the time */ }
    }
    $('dlg').close();
    await load();
  }

  $('dlgGo').onclick = openMaterial;
  $('dlgDone').onclick = finish;
  $('dlgClose').onclick = abandon;
  // Escape closes a modal <dialog> natively, firing no click handler. Without
  // this the heartbeat would keep running against a sitting nobody is in,
  // booking hours that never happened onto the estate dashboard — and the
  // fresh heartbeat would keep the reaper from ever settling it.
  $('dlg').addEventListener('close', function () {
    if (dlgHandled) { dlgHandled = false; return; }
    abandon().catch(function () {});
  });

  load();
})();
</script>
</body>
</html>
