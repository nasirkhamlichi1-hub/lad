      '<div class="pw-dtitle" translate="no"' + (rtl ? ' dir="rtl" lang="ar"' : '') + '>' + esc(L.title) + '</div>' +
      '<div class="pw-ways' + (L.steps.length > 1 ? '' : ' one') + '">' + L.steps.map(function (a) {
        var w = wayOf(a), meta = metaLine(a);
        var sub = flPick(a, 'title') !== L.title ? '<div class="pw-sub" translate="no" dir="auto">' + esc(flPick(a, 'title')) + '</div>' : '';
        return '<div class="pw-way ' + w.cls + (a.locked ? ' locked' : '') + '"><h4><span class="pw-ic ' + w.cls + '">' + w.icon + '</span>' + esc(isAr() ? w.ar : w.en) +
          (w.cls === 'ai' ? '<span class="pw-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>' : '') + '</h4>' + sub +
          '<p>' + esc(isAr() ? w.d[1] : w.d[0]) + '</p>' +
          '<div class="pw-meta">' + esc(isAr() ? w.what[1] : w.what[0]) + (meta ? ' · ' + esc(meta) : '') + '</div>' +
          '<div class="pw-wfoot">' + statusPill(a) + '<button type="button" data-id="' + esc(a.id) + '"' + (a.locked ? ' disabled' : '') + '>' + actLabel(a) + '</button></div></div>';
      }).join('') + '</div>' +
      (L.steps.length > 1 ? '<div class="pw-both">✦ ' + T('Take both for the complete lesson — each counts on its own.', 'أكمل الطريقتين لتحصل على الدرس كاملاً — وتُحتسب كل منهما على حدة.') + '</div>' : '') +
      '<div class="pw-law"></div>';
    last.after(d);
    d.querySelector('.pw-x').onclick = function () { openLesson(-1); };
    d.querySelectorAll('button[data-id]').forEach(function (b) {
      b.onclick = function () { var a = spineActs.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; if (a) launch(a); };
    });
    decoratePath();
    if (scroll && d.scrollIntoView) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Re-place an open drawer when the grid reflows (window resized).
  var pwResize;
  // Only a change of width can move a card to another row; a phone's address
  // bar hiding on scroll changes the height alone and must not redraw it.
  var pwWidth = window.innerWidth;
  window.addEventListener('resize', function () { clearTimeout(pwResize); pwResize = setTimeout(function () {
    if (window.innerWidth === pwWidth) return; pwWidth = window.innerWidth;
    if (PATH.open >= 0) openLesson(PATH.open, false); }, 150); });

  async function load() {
    if (!TOPIC) {
      note('No course specified. Open this page from <a href="home.html">My training</a>.', true);
      $('body').innerHTML = '';
      return;
    }
    var data;
    try { data = await api.courseOutline(TOPIC); }
    catch (e) { note('Could not load this course: ' + esc(e.message), true); $('body').innerHTML = ''; return; }

    // The hub record carries the look (photo, accent) as well as the reference
    // library, and the look has to land before the hero paints — otherwise the
    // page flashes the default green and then re-colours itself.
    try { HUB = await api.hubGet(TOPIC); } catch (e) { HUB = null; }
    applyHubLook(HUB);

    // Enrol on first visit so progress has somewhere to land. Every course is
    // free and open to every lawyer, so opening it is joining it.
    if (!data.enrolment) {
      try { await api.enrolMe(TOPIC); data = await api.courseOutline(TOPIC); }
      catch (e) { /* anonymous preview — still render the outline */ }
    }
    renderHero(data);
    renderPath(data);
    loadLibrary();
  }

  // ─── The look of this hub ───────────────────────────────────────
  // An admin can give a course its own photo and its own colour. Everything
  // the page tints — the ring, the step markers, the buttons, the hero
  // gradient — is derived from that one accent, so a single choice re-skins
  // the hub without anyone picking six shades by hand.
  var HUB = null;
  var HUB_ACCENT = false;   // the admin gave this course its own colour
  function toRgb(h) {
    h = String(h || '').replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function toHex(c) {
    return '#' + c.map(function (v) {
      v = Math.max(0, Math.min(255, Math.round(v)));
      return ('0' + v.toString(16)).slice(-2);
    }).join('');
  }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  function applyHubLook(hub) {
    if (!hub) return;
    var root = document.documentElement;
    var hero = document.querySelector('.hero');

    var accent = String(hub.accent || '').trim();
    if (/^#[0-9a-fA-F]{6}$/.test(accent)) {
      HUB_ACCENT = true;
      var c = toRgb(accent);
      var dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var paper = dark ? [22, 26, 22] : [255, 255, 255];
      var ink = [0, 0, 0];
      root.style.setProperty('--green', accent);
      root.style.setProperty('--green-deep', toHex(mix(c, ink, dark ? 0.55 : 0.32)));
      root.style.setProperty('--green-soft', toHex(mix(c, paper, dark ? 0.84 : 0.89)));
      root.style.setProperty('--green-line', toHex(mix(c, paper, dark ? 0.55 : 0.62)));
      root.style.setProperty('--hero-a', toHex(mix(c, ink, 0.88)));
      root.style.setProperty('--hero-b', toHex(mix(c, ink, 0.70)));
      root.style.setProperty('--hero-c', toHex(mix(c, ink, 0.42)));
    }

    var photo = String(hub.hero_url || hub.hero_image || '').trim();
    // Only shapes the server already vetted — no quotes, brackets or scheme games.
    if (hero && photo && /^(https?:\/\/|\/)/.test(photo) && !/["'()\\<>\s]/.test(photo)) {
      hero.style.setProperty('--hero-photo', 'url(' + photo + ')');
      hero.classList.add('has-photo');
    }
  }

  // ─── The reference library ──────────────────────────────────────
  // Laws, articles, videos and source documents for this topic, presented
  // brief-first: what each source is and why it matters, with the whole
  // document one click behind it. Everything opens inside the hub.
  function ytId(u) {
    var m = String(u || '').match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    return m ? m[1] : null;
  }
  function domainOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return 'link'; } }

  // ─── Reference library: ask, then read ──────────────────────────
  // One question bar and one shelf. The answer comes only from this course's
  // documents, footnoted to the article it came from; the documents it drew
  // on rise to the top of the shelf, marked with those articles. Around the
  // shelf: a plain line under each instrument saying what it does, questions
  // to try, "what applies to me" situations that pick out the documents to
  // read in order, three ways to browse (list, timeline, by subject), the
  // learner's own reading trail (opened, pinned), and links between the
  // documents and the course steps they support. Those extras are drafted
  // by the server from the documents themselves and arrive after the list;
  // without them the shelf is simply a list. Everything renders in the
  // site's language.
  var LIB_MATS = [], LIB_LAWS = [];
  var LIB = { insights: null, reads: {}, view: 'list', situation: -1, sits: [], cited: {} };
  var STEP_NO = {};   // activity id → its number on the path
  function T(en, ar) { return (window.LAD_LANG || document.documentElement.getAttribute('lang')) === 'ar' ? ar : en; }
  function isAr() { return (window.LAD_LANG || document.documentElement.getAttribute('lang')) === 'ar'; }
  function signedIn() { return !!(api.getToken && api.getToken()); }
  function cssId(v) { return window.CSS && CSS.escape ? CSS.escape(v) : String(v).replace(/["\\]/g, '\\$&'); }

  // What kind of instrument a title names, in both languages, with a sort rank.
  function instrumentOf(m) {
    var t = (String(m.title || '') + ' ' + String(m.title_ar || '')).toLowerCase();
    var vid = m.kind === 'link' ? ytId(m.url) : null;
    if (m.kind === 'brief' && m.brief_tag) return { en: m.brief_tag, ar: m.brief_tag, rank: 45 };
    if (m.kind === 'scorm') return { en: 'E-learning module', ar: 'وحدة تعلم إلكتروني', rank: 90 };
    if (vid) return { en: 'Video', ar: 'فيديو', rank: 80 };
    if (/المجلس التنفيذي|executive council/.test(t)) return { en: 'Executive Council Resolution', ar: 'قرار المجلس التنفيذي', rank: 20 };
    if (/مرسوم|decree/.test(t)) return { en: 'Decree', ar: 'مرسوم', rank: 15 };
    if (/قانون|\blaw\b/.test(t)) return { en: 'Law', ar: 'قانون', rank: 10 };
    if (/لائحة|regulation/.test(t)) return { en: 'Regulation', ar: 'لائحة', rank: 25 };
    if (/قرار إداري|قرار اداري|administrative decision/.test(t)) return { en: 'Administrative Decision', ar: 'قرار إداري', rank: 30 };
    if (/قرار|resolution|decision/.test(t)) return { en: 'Decision', ar: 'قرار', rank: 32 };
    if (/تعميم|circular/.test(t)) return { en: 'Circular', ar: 'تعميم', rank: 35 };
    if (/دليل|guide|guidance|manual|handbook/.test(t)) return { en: 'Guidance', ar: 'دليل إرشادي', rank: 40 };
    if (m.kind === 'link') return { en: 'Web page', ar: 'صفحة ويب', rank: 60 };
    if (/pdf/i.test(m.mime || '') || /\.pdf$/i.test(m.file_name || '')) return { en: 'PDF', ar: 'ملف PDF', rank: 50 };
    return { en: 'Document', ar: 'مستند', rank: 55 };
  }
  function yearOf(m) {
    if (m.brief_year) return String(m.brief_year);
    var s = (String(m.title || '') + ' ' + String(m.title_ar || '')).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
    var y = s.match(/\b(19[5-9]\d|20[0-4]\d)\b/);
    return y ? y[1] : '';
  }

  // The knowledge hub's briefs (title, year, summary) fold into the list: a
  // brief that names a document lends it its summary; one that names nothing
  // becomes a row of its own, without an Open link.
  function libItems() {
    var norm = function (t) { return String(t || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim(); };
    var items = LIB_MATS.map(function (m) { return Object.assign({}, m); });
    LIB_LAWS.forEach(function (d) {
      var want = norm(d.title); if (!want) return;
      var hit = items.filter(function (m) { var n = norm(m.title) + ' ' + norm(m.title_ar); return n.indexOf(want) >= 0 || want.indexOf(norm(m.title)) === 0; })[0];
      if (hit) { if (!hit.description && d.summary) hit.description = d.summary; return; }
      items.push({ id: 'brief-' + norm(d.title).replace(/\s+/g, '-'), kind: 'brief', title: d.title, title_ar: null,
        description: d.summary || '', brief_tag: d.tag || '', brief_year: d.year || '' });
    });
    return items;
  }

  // What the server drafted about a document (summary, subject) — shared by
  // a document and its twin in the other language.
  function insightFor(m) {
    var I = LIB.insights;
    if (!I || !I.documents) return null;
    return I.documents[m.id] || (m.pair_id && I.documents[m.pair_id]) || null;
  }
  // One plain line saying what the document does. The author's own
  // description wins on the English site; the Arabic site prefers the
  // Arabic draft, since descriptions are usually written in English.
  function summaryOf(m) {
    var d = insightFor(m);
    if (isAr()) return (d && d.summary_ar) || m.description || (d && d.summary_en) || '';
    return m.description || (d && (d.summary_en || d.summary_ar)) || '';
  }
  function subjectOf(m) {
    var d = insightFor(m);
    if (!d || !d.subject) return null;
    return (LIB.insights.subjects || []).filter(function (s) { return s.key === d.subject; })[0] || null;
  }
  function subjectName(s) { return s ? (isAr() ? (s.ar || s.en) : (s.en || s.ar)) : ''; }
  function readOf(m) { return LIB.reads[m.id] || (m.pair_id && LIB.reads[m.pair_id]) || null; }
  function citedOf(m) { return LIB.cited[m.id] || (m.pair_id && LIB.cited[m.pair_id]) || null; }
  // The step numbers on the path that this document supports.
  function stepsFor(m) {
    var S = (LIB.insights && LIB.insights.steps) || {}, out = [];
    Object.keys(S).forEach(function (aid) {
      if (STEP_NO[aid] && S[aid].some(function (id) { return id === m.id || (m.pair_id && id === m.pair_id); })) out.push(STEP_NO[aid]);
    });
    return out.sort(function (a, b) { return a - b; });
  }
  // A material id from the server, resolved to the row shown on this site.
  function findItem(items, id) {
    return items.filter(function (x) { return x.id === id || (x.pair_id && x.pair_id === id); })[0] || null;
  }

  function titleBits(m) {
    var title = flPick(m, 'title') || m.file_name || '';
    return { text: title, dir: /[؀-ۿ]/.test(title) ? ' dir="rtl" lang="ar"' : ' dir="ltr"' };
  }

  // One card per document, in every view: what kind of instrument it is and
  // its year, a plain line saying what it does, the official title, then
  // what links it to the rest of the page (the articles an answer cited, the
  // steps it supports, its subject), and the learner's own marks on it.
  function libCard(m, o) {
    o = o || {};
    var kind = instrumentOf(m);
    var t = titleBits(m);
    var s = subjectOf(m);
    var sum = summaryOf(m);
    var year = yearOf(m);
    var brief = m.kind === 'brief';
    var done = m.learner && m.learner.completed;
    var rd = readOf(m);
    var opened = !!(rd && rd.opened);
    var pinned = !!(rd && rd.pinned);
    var meta = m.kind === 'scorm'
      ? (done ? (m.learner.score != null ? esc(String(m.learner.score)) + '%' : '✓') : '')
      : esc(year);
    var action = brief ? '' : (m.kind === 'scorm' ? (done ? T('Review', 'مراجعة') : T('Start', 'ابدأ')) : T('Open', 'افتح'));
    var tags = (o.arts || []).map(function (a) { return '<span class="lx-art" translate="no">' + esc(a) + '</span>'; }).join('') +
      (o.cited ? '<span class="lib-cited">' + T('cited above', 'مُستشهد به أعلاه') + '</span>' : '') +
      (brief ? [] : stepsFor(m)).map(function (n) { return '<span class="lx-tag">' + T('Used in lesson ', 'تُستخدم في الدرس ') + n + '</span>'; }).join('') +
      (s && LIB.view !== 'subject' ? '<span class="lx-tag">' + esc(subjectName(s)) + '</span>' : '');
    var mine = brief || !signedIn() ? '' :
      '<span class="lx-tick' + (opened ? ' on' : '') + '" title="' + (opened ? T('You have opened this', 'فتحت هذا المستند') : T('Not opened yet', 'لم يُفتح بعد')) + '">✓</span>' +
      '<button type="button" class="lx-pin' + (pinned ? ' on' : '') + '" data-pin="' + esc(m.id) + '" aria-pressed="' + pinned + '" title="' +
        (pinned ? T('Unpin', 'إلغاء التثبيت') : T('Pin to the top', 'ثبّت في الأعلى')) + '">★</button>';
    return '<div class="lx-card' + (o.cited ? ' cited' : '') + (pinned ? ' pinned' : '') + (brief ? ' lib-brief' : '') + '" data-mid="' + esc(m.id) +
        '" data-subject="' + esc(s ? s.key : '') + '"' + (brief ? '' : ' role="button" tabindex="0"') + '>' +
      '<div class="lx-card-top">' + (o.step ? '<span class="lx-num">' + o.step + '</span>' : '') +
        '<span class="lib-kind">' + esc(isAr() ? kind.ar : kind.en) + '</span>' +
        (meta ? '<span class="lx-year' + (done ? ' lib-done' : '') + '">' + meta + '</span>' : '') + '</div>' +
      (sum ? '<span class="lx-sum">' + esc(sum) + '</span>' : '') +
      '<span class="lx-ct' + (sum ? '' : ' lx-ct-main') + '" translate="no"' + t.dir + '>' + esc(t.text) + '</span>' +
      (tags ? '<span class="lx-tags">' + tags + '</span>' : '') +
      '<div class="lx-card-foot">' + mine + '<span class="lib-open">' + (action ? action + ' <span class="lib-arrow">→</span>' : '') + '</span></div>' +
    '</div>';
  }

  function sortedItems() {
    return libItems().sort(function (a, b) {
      var ra = instrumentOf(a).rank, rb = instrumentOf(b).rank;
      if (ra !== rb) return ra - rb;
      return (yearOf(a) || '9999').localeCompare(yearOf(b) || '9999');
    });
  }
  function rowOpts(m) { var c = citedOf(m); return { cited: !!c, arts: c || [] }; }

  function listBody(items) {
    // Cited first, in the order the answer cited them; then pinned; then the rest.
    var order = function (m) {
      var c = citedOf(m);
      if (c) return c.order;
      var r = readOf(m);
      return r && r.pinned ? 1000 : 2000;
    };
    var list = items.map(function (m, i) { return { m: m, i: i }; })
      .sort(function (a, b) { return (order(a.m) - order(b.m)) || (a.i - b.i); })
      .map(function (x) { return x.m; });
    return '<div class="lx-grid">' + list.map(function (m) { return libCard(m, rowOpts(m)); }).join('') + '</div>';
  }

  function timelineBody(items) {
    var by = {}, years = [];
    items.forEach(function (m) { var y = yearOf(m) || ''; if (!by[y]) { by[y] = []; years.push(y); } by[y].push(m); });
    years.sort(function (a, b) { return (a || '9999').localeCompare(b || '9999'); });
    return '<div class="lx-tl" id="lx-tl">' + years.map(function (y) {
      return '<div class="lx-tl-year"><div class="lx-tl-y">' + (y ? esc(y) : T('Undated', 'بلا تاريخ')) + '</div>' +
        '<div class="lx-tl-items">' + by[y].map(function (m) { return libCard(m, rowOpts(m)); }).join('') + '</div></div>';
    }).join('') + '</div>';
  }

  function subjectBody(items) {
    var groups = (LIB.insights.subjects || []).map(function (s) {
      return { s: s, items: items.filter(function (m) { var x = subjectOf(m); return x && x.key === s.key; }) };
    }).filter(function (g) { return g.items.length; });
    var rest = items.filter(function (m) { return !subjectOf(m); });
    if (rest.length) groups.push({ s: { key: '', en: 'Other material', ar: 'مواد أخرى' }, items: rest });
    return '<div class="lx-subjects">' + groups.map(function (g) {
      return '<section class="lx-subj"><div class="lx-subj-head"><span class="lx-hub"></span><h4>' + esc(subjectName(g.s)) + '</h4><span>' + g.items.length + '</span></div>' +
        '<div class="lx-subj-items">' + g.items.map(function (m) { return libCard(m, rowOpts(m)); }).join('') + '</div></section>';
    }).join('') + '</div>';
  }

  function situationBody(items) {
    var s = LIB.sits[LIB.situation];
    var seen = {}, list = [];
    s.documents.forEach(function (id) { var m = findItem(items, id); if (m && !seen[m.id]) { seen[m.id] = 1; list.push(m); } });
    return '<p class="lx-sit-note">' + T('Read these in this order.', 'اقرأ هذه المستندات بهذا الترتيب.') +
      ' <button type="button" class="lx-link" id="lx-all">' + T('Show all documents', 'اعرض كل المستندات') + '</button></p>' +
      '<div class="lx-grid">' + list.map(function (m, i) { var o = rowOpts(m); o.step = i + 1; return libCard(m, o); }).join('') + '</div>';
  }

  function renderLibList() {
    var host = $('lib-list');
    if (!host) return;
    var items = sortedItems();
    var docs = items.filter(function (m) { return m.kind !== 'scorm'; }).length;
    var mods = items.length - docs;
    var count = isAr()
      ? (docs + ' ' + (docs === 1 ? 'مستند' : 'مستندات') + (mods ? ' · ' + mods + ' ' + (mods === 1 ? 'وحدة' : 'وحدات') : ''))
      : (docs + ' ' + (docs === 1 ? 'document' : 'documents') + (mods ? ' · ' + mods + ' ' + (mods === 1 ? 'module' : 'modules') : ''));
    var I = LIB.insights;
    var views = [['list', T('List', 'قائمة')], ['timeline', T('Timeline', 'خط زمني')]];
    if (I && I.subjects && I.subjects.length > 1) views.push(['subject', T('By subject', 'حسب الموضوع')]);
    if (!views.some(function (v) { return v[0] === LIB.view; })) LIB.view = 'list';
    var readable = items.filter(function (m) { return m.kind !== 'brief'; });
    var opened = readable.filter(function (m) { var r = readOf(m); return r && r.opened; }).length;
    var meter = signedIn() && readable.length
      ? '<div class="lx-meter"><span>' + (isAr() ? ('فتحت ' + opened + ' من ' + readable.length) : (opened + ' of ' + readable.length + ' opened')) + '</span>' +
        '<i><b style="width:' + Math.round(opened / readable.length * 100) + '%"></b></i></div>'
      : '<span></span>';
    var inSituation = LIB.situation >= 0 && LIB.sits[LIB.situation];
    var head = '<div class="lib-list-head"><h3>' + T('In this course', 'في هذه الدورة') + '</h3><span>' + count + '</span></div>' +
      '<div class="lx-bar">' + (inSituation ? '<span></span>' :
        '<div class="lx-views" role="group" aria-label="' + T('View', 'العرض') + '">' + views.map(function (v) {
          return '<button type="button" class="lx-view' + (LIB.view === v[0] ? ' on' : '') + '" data-view="' + v[0] + '" aria-pressed="' + (LIB.view === v[0]) + '">' + v[1] + '</button>';
        }).join('') + '</div>') + meter + '</div>';
    var body = inSituation ? situationBody(items)
      : LIB.view === 'timeline' ? timelineBody(items)
      : LIB.view === 'subject' ? subjectBody(items)
      : listBody(items);
    host.innerHTML = head + body;

    host.querySelectorAll('.lx-card').forEach(function (n) {
      var mid = n.getAttribute('data-mid');
      var m = LIB_MATS.filter(function (x) { return x.id === mid; })[0];
      if (!m) return;
      var go = function () { var c = citedOf(m); openReference(m, null, { article: c && c[0] }); };
      n.onclick = function (e) { if (e.target.closest('.lx-pin')) return; go(); };
      n.onkeydown = function (e) { if (e.target !== n) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
    host.querySelectorAll('.lx-pin').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var mid = b.getAttribute('data-pin');
        var on = b.getAttribute('aria-pressed') !== 'true';
        LIB.reads[mid] = Object.assign({}, LIB.reads[mid] || { opened: false }, { pinned: on });
        renderLibList();
        api.pinMaterial(TOPIC, mid, on).then(function (r) { if (r) LIB.reads[mid] = r; }).catch(function () {
          LIB.reads[mid].pinned = !on; renderLibList();
        });
      };
    });
    host.querySelectorAll('.lx-view').forEach(function (b) {
      b.onclick = function () { LIB.view = b.getAttribute('data-view'); renderLibList(); };
    });
    var all = $('lx-all');
    if (all) all.onclick = function () { LIB.situation = -1; renderFinder(); renderLibList(); };
    // Timeline: hovering a document lights up the others on the same subject.
    var tl = $('lx-tl');
    if (tl) tl.querySelectorAll('.lx-card').forEach(function (c) {
      c.onmouseenter = function () {
        var k = c.getAttribute('data-subject');
        if (!k) return;
        tl.classList.add('hovering');
        tl.querySelectorAll('.lx-card').forEach(function (o) { o.classList.toggle('hl', o.getAttribute('data-subject') === k); });
      };
      c.onmouseleave = function () { tl.classList.remove('hovering'); tl.querySelectorAll('.lx-card').forEach(function (o) { o.classList.remove('hl'); }); };
    });
  }

  // "What applies to me?" — a situation picks out the documents to read, in order.
  function renderFinder() {
    var box = $('lx-finder');
    if (!box) return;
    var items = libItems();
    var S = (LIB.insights && LIB.insights.situations) || [];
    LIB.sits = S.filter(function (s) { return (s.documents || []).some(function (id) { return findItem(items, id); }); });
    if (LIB.situation >= LIB.sits.length) LIB.situation = -1;
    if (!LIB.sits.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="lx-finder-head">' + T('What applies to me?', 'ما الذي ينطبق عليّ؟') + '</div>' +
      '<div class="lx-chips">' + LIB.sits.map(function (s, i) {
        return '<button type="button" class="lx-chip' + (LIB.situation === i ? ' on' : '') + '" data-sit="' + i + '" aria-pressed="' + (LIB.situation === i) + '">' +
          esc(isAr() ? (s.ar || s.en) : (s.en || s.ar)) + '</button>';
      }).join('') + '</div>';
    box.querySelectorAll('.lx-chip').forEach(function (c) {
      c.onclick = function () {
        var i = Number(c.getAttribute('data-sit'));

  // Questions worth asking, drafted from the documents — one click asks.
  function renderSuggestions() {
    var box = $('lx-sugs');
    if (!box) return;
    var Q = LIB.insights && LIB.insights.questions;
    var list = Q ? ((isAr() ? Q.ar : Q.en) || []) : [];
    if (!list.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<span class="lx-sugs-label">' + T('Try:', 'جرّب:') + '</span>' +
      list.map(function (q) { return '<button type="button" class="lx-sug">' + esc(q) + '</button>'; }).join('');
    box.querySelectorAll('.lx-sug').forEach(function (b) {
      b.onclick = function () { $('lib-q').value = b.textContent; askLibrary(); };
    });

  // The documents behind the open lesson's steps, shown in its drawer.
  function decoratePath() {
    var box = document.querySelector('.pw-drawer .pw-law');
    if (!box) return;
    box.innerHTML = '';
    var S = LIB.insights && LIB.insights.steps;
    var L = PATH.lessons[PATH.open];
    if (!S || !LIB_MATS.length || !L) return;
    var items = libItems(), mats = [];
    L.steps.forEach(function (a) {
      (S[a.id] || []).forEach(function (id) {
        var m = findItem(items, id);
        if (!m || m.kind === 'scorm' || m.kind === 'brief' || mats.indexOf(m) >= 0) return;
        // A document step IS its document — it need not point at itself.
        if (a.material_id === m.id || a.material_id_ar === m.id || (m.pair_id && (a.material_id === m.pair_id || a.material_id_ar === m.pair_id))) return;
        mats.push(m);
      });
    });
    if (!mats.length) return;
    box.innerHTML = '<div class="lx-steplaw"><span>' + T('The law behind this lesson:', 'النصوص التي يستند إليها هذا الدرس:') + '</span>' +
      mats.map(function (m) {
        var t = titleBits(m);
        return '<button type="button" data-lawmid="' + esc(m.id) + '" title="' + esc(t.text) + '">' + esc(summaryOf(m) || t.text) + '</button>';
      }).join('') + '</div>';
    box.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () {
        var m = LIB_MATS.filter(function (x) { return x.id === b.getAttribute('data-lawmid'); })[0];
        if (m) openReference(m);
      };
    });
  }

  function refreshLibrary() {
    renderSuggestions(); renderFinder(); renderLibList(); decoratePath();
  }

  function renderAnswer(out, question) {
    var box = $('lib-answer');
    LIB.cited = {};
    if (!out) { box.innerHTML = ''; box.style.display = 'none'; renderLibList(); return; }
    (out.citations || []).forEach(function (c) {
      var e = LIB.cited[c.material_id] || (LIB.cited[c.material_id] = []);
      if (e.order == null) e.order = Object.keys(LIB.cited).length;
      if (c.label && e.indexOf(c.label) < 0) e.push(c.label);
    });
    var text = esc(out.answer || '').replace(/\s*\[(\d+)\]/g, function (_, n) {
      return '<sup class="lib-fn" data-n="' + n + '">' + n + '</sup>';
    });
    var srcs = (out.citations || []).map(function (c) {
      var name = (isAr() && c.title_ar) ? c.title_ar : (c.title || '');
      return '<a class="lib-src" data-mid="' + esc(c.material_id) + '" data-n="' + c.n + '" href="#"><sup>' + c.n + '</sup>' +
        '<span translate="no" dir="auto">' + esc(name) + '</span>' + (c.label ? '<span class="lib-src-art">' + esc(c.label) + '</span>' : '') + '</a>';
    }).join('');
    var note = out.found
      ? T('Not legal advice — read the instruments.', 'ليست استشارة قانونية — راجع النصوص.')
      : T('The documents in this course do not answer that. Try another question, or open the instruments below.',
          'لا تجيب مستندات هذه الدورة عن هذا السؤال. جرّب سؤالاً آخر أو افتح النصوص أدناه.');
    box.innerHTML = '<p class="lib-answer-text"' + (isAr() ? ' dir="rtl"' : '') + '>' + (out.found ? text : esc(out.answer || '')) + '</p>' +
      '<div class="lib-sources">' + srcs + '<span class="lib-note">' + note + '</span></div>';
    box.style.display = 'block';
    box.querySelectorAll('.lib-src, .lib-fn').forEach(function (n) {
      n.onclick = function (e) {
        e.preventDefault();
        var c = (out.citations || []).filter(function (x) { return String(x.n) === n.getAttribute('data-n'); })[0];
        var mid = n.getAttribute('data-mid') || (c && c.material_id);
        var m = LIB_MATS.filter(function (x) { return x.id === mid || x.pair_id === mid; })[0];
        if (m) openReference(m, null, { article: c && c.label });
      };
    });
    // The sources rise to the top of the list, so show the list.
    if (out.found) { LIB.situation = -1; LIB.view = 'list'; renderFinder(); }
    renderLibList();
  }

  async function askLibrary() {
    var input = $('lib-q'), btn = $('lib-ask');
    var q = (input.value || '').trim();
    if (q.length < 3) { input.focus(); return; }
    btn.disabled = true; input.disabled = true;
    var box = $('lib-answer');
    box.style.display = 'block';
    box.innerHTML = '<p class="lib-answer-text lib-busy">' + T('Reading the documents…', 'جارٍ قراءة المستندات…') + '</p>';
    try {
      var out = await api.askLibrary(TOPIC, { question: q, lang: isAr() ? 'ar' : 'en' });
      renderAnswer(out, q);
    } catch (e) {
      var msg = (e && e.message) || '';
      var friendly = /AIMODEL|configured/i.test(msg)
        ? T('The library cannot answer questions on this server yet.', 'لا يمكن للمكتبة الإجابة عن الأسئلة على هذا الخادم بعد.')
        : T('Could not answer that just now — please try again.', 'تعذّر الحصول على إجابة الآن — حاول مرة أخرى.');
      box.innerHTML = '<p class="lib-answer-text">' + esc(friendly) + '</p>';
    } finally { btn.disabled = false; input.disabled = false; }
  }

  // The drafted extras arrive after the list. A first visit to a course
  // starts the draft on the server; the page checks back until it lands.
  async function loadInsights(tries) {
    tries = tries || 0;
    var I = null;
    try { I = await api.libraryInsights(TOPIC); } catch (e) { return; }
    if (!I || !I.available) return;
    if (I.documents) { LIB.insights = I; refreshLibrary(); }
    if ((I.pending || I.stale) && tries < 15) setTimeout(function () { loadInsights(tries + 1); }, 6000);
  }
  async function loadReads() {
    if (!signedIn()) return;
    try { var r = await api.libraryReads(TOPIC); LIB.reads = (r && r.reads) || {}; renderLibList(); } catch (e) { /* not signed in for this course */ }
  }
  // Opening a document is remembered for the learner's own trail.
  function noteRead(m, courseId) {
    if (!signedIn() || !m || m.kind === 'brief' || (courseId && courseId !== TOPIC)) return;
    if (!LIB_MATS.some(function (x) { return x.id === m.id; })) return;
    LIB.reads[m.id] = Object.assign({}, LIB.reads[m.id] || { pinned: false }, { opened: true });
    renderLibList();
    api.markMaterialRead(TOPIC, m.id).then(function (r) { if (r) { LIB.reads[m.id] = r; renderLibList(); } }).catch(function () {});
  }

  async function loadLibrary() {
    var box = $('library');
    var mats = [];
    try { var r = await api.listCourseMaterials(TOPIC); mats = (r && r.materials) || []; }
    catch (e) { /* anonymous preview, or no access yet */ }
    // A paired item exists once per language — keep the row for this site.
    var allMats = mats;
    // E-learning packages are course steps, uploaded through the step's own
    // "Upload module" — they belong on the pathway, not on the shelf.
    LIB_MATS = mats.filter(function (m) { return m.kind !== 'scorm' && flMatVisible(m, allMats); });
    LIB_LAWS = (HUB && HUB.legislation) || [];
    var faq = (HUB && HUB.faq) || [];
    if (!LIB_MATS.length && !faq.length) { box.style.display = 'none'; return; }

    var html = '';
    if (LIB_MATS.length) {
      html += '<div class="lib">' +
        '<div class="sec-kicker">' + T('Reference library', 'المكتبة المرجعية') + '</div>' +
        '<h2 class="section-title" style="margin-top:0">' + T('Documents and reference material', 'المستندات والمواد المرجعية') + '</h2>' +
        '<p class="sec-lede">' + T('Ask a question, or open any instrument in full.', 'اطرح سؤالاً، أو افتح أي نص كاملاً.') + '</p>' +
        '<form class="lib-ask" id="lib-form"><span class="lib-spark">✦</span>' +
          '<input id="lib-q" type="text" autocomplete="off" maxlength="500" placeholder="' +
            T("Ask anything about this course's laws — in Arabic or English", 'اسأل أي شيء عن قوانين هذه الدورة — بالعربية أو الإنجليزية') + '">' +
          '<button type="submit" id="lib-ask">' + T('Ask', 'اسأل') + '</button></form>' +
        '<div class="lib-hint">' + T('Answers come only from the documents below, and cite the article they came from.',
                                      'تأتي الإجابات من المستندات أدناه فقط، مع الإشارة إلى المادة التي أُخذت منها.') + '</div>' +
        '<div class="lx-sugs" id="lx-sugs"></div>' +
        '<div class="lib-answer" id="lib-answer" style="display:none"></div>' +
        '<div class="lx-finder" id="lx-finder"></div>' +
        '<div class="lib-list" id="lib-list"></div>' +
      '</div>';
    }
    if (faq.length) {
      html += '<div class="sec-kicker" style="margin-top:44px">' + T('Frequently asked', 'الأسئلة الشائعة') + '</div>' +
        '<h2 class="section-title" style="margin-top:0">' + T('Quick answers', 'إجابات سريعة') + '</h2>' +
        '<div class="qa-wrap" style="margin-top:18px">' + faq.map(function (q) {
          return '<details class="qa"><summary><span class="qa-ic">+</span><span>' + esc(q.q) + '</span></summary>' +
            '<div class="qa-a">' + esc(q.a) + '</div></details>';
        }).join('') + '</div>';
    }
    box.innerHTML = html;
    box.style.display = 'block';
    if (LIB_MATS.length) {
      renderLibList();
      $('lib-form').onsubmit = function (e) { e.preventDefault(); askLibrary(); };
      loadReads();
      loadInsights();
    }
  }

  // ─── The reader ─────────────────────────────────────────────────
  function readerShow(kindLabel, title) {
    $('rKind').textContent = kindLabel; $('rTitle').textContent = title;
    ['rOpen', 'rDown', 'rText', 'rOrig', 'rQuiz'].forEach(function (id) { $(id).style.display = 'none'; });
    $('rText').textContent = T('Text', 'النص'); $('rOrig').textContent = T('Original', 'الأصل');
    $('rQuiz').textContent = T('Test yourself', 'اختبر نفسك');
    $('rBody').innerHTML = '<div class="rmsg">' + T('Opening…', 'جارٍ الفتح…') + '</div>';
    $('reader').showModal();
  }
  function readerFrame(url, sandboxed) {
    var f = document.createElement('iframe');
    if (sandboxed) f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
    f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.src = url;
    $('rBody').innerHTML = ''; $('rBody').appendChild(f);
  }
  function readerNewTab(url) { var b = $('rOpen'); b.style.display = ''; b.onclick = function () { window.open(url, '_blank'); }; }
  function readerDownload(url, name) {
    var b = $('rDown'); b.style.display = '';
    b.onclick = function () { var a = document.createElement('a'); a.href = url; a.download = name || 'material'; document.body.appendChild(a); a.click(); a.remove(); };
  }
  // Tearing the reader down. Split out from the button because Escape closes a
  // modal <dialog> natively without firing any click handler — and leaving this
  // undone meant the heartbeat kept running against a sitting nobody was in,
  // booking hours that never happened onto the estate dashboard, and leaving a
  // SCORM iframe alive inside a closed dialog to report a stale finish later.
  function teardownReader() {
    $('rBody').innerHTML = '';
    if (scormSession && !scormSession.done) {
      stopHeartbeat();
      var sess = scormSession; scormSession = null;
      var seconds = Math.max(5, Math.round((Date.now() - openedAt) / 1000));
      api.closeAttempt(sess.attempt.id, { completed: false, abandoned: true, seconds: seconds })
        .catch(function () { }).then(function () { return load(); });
    }
  }
  $('rClose').onclick = function () { $('reader').close(); };
  // 'close' fires however the dialog went away — button, Escape, or .close().
  $('reader').addEventListener('close', teardownReader);

  // Fetch a material's bytes WITH the sign-in token (a plain browser tab has
  // no token, which is why raw download links used to answer "no_access").
  async function fetchMaterialBlob(courseId, mid) {
    var resp = await fetch((window.LAD_API_BASE || '') + '/api/v1/courses/' +
      encodeURIComponent(courseId) + '/materials/' + encodeURIComponent(mid) + '/download',
      { headers: api.getToken() ? { 'Authorization': 'Bearer ' + api.getToken() } : {} });
    if (!resp.ok) throw new Error('Could not open this material (' + resp.status + ')');
    return resp.blob();
  }

  async function openReference(m, courseId, opts) {
    courseId = courseId || TOPIC;
    opts = opts || {};
    if (!m) return;
    noteRead(m, courseId);
    var vid = m.kind === 'link' ? ytId(m.url) : null;
    if (vid) {
      readerShow('VIDEO', flPick(m, 'title'));
      readerFrame('https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0');
      readerNewTab(m.url);
      return;
    }
    if (m.kind === 'scorm' && m.has_file) {
      // If this package is also a step on the journey, play it through the
      // tracked path so finishing it counts — otherwise a learner who does
      // the whole thing from the library earns nothing on the ring.
      var step = spineActs.filter(function (a) { return a.kind === 'scorm' && (a.material_id === m.id || a.material_id_ar === m.id); })[0];
      if (step) { launch(step); return; }
      // An uploaded package plays inside the hub, against our own runtime.
      readerShow('INTERACTIVE', flPick(m, 'title'));
      try { readerFrame(await scormPlayerUrl(courseId, m.id)); }
      catch (e) { $('rBody').innerHTML = '<div class="rmsg">' + esc(e.message || 'Could not open the package.') + '</div>'; }
      return;
    }
    // A web link opens on its own site unless the library has actually read
    // its text — only then is there an article-by-article view to show. The
    // tab opens here, inside the click, so the browser does not block it.
    if (m.kind === 'scorm' || (m.kind === 'link' && m.indexed !== true)) {
      // External sites usually refuse to be embedded — open them properly.
      window.open(m.url, '_blank');
      return;
    }
    // A document the library can read opens as text, article by article, at
    // the article an answer cited; the original file is one click away.
    var isPdf = /pdf/i.test(m.mime || '') || /\.pdf$/i.test(m.file_name || '');
    readerShow(m.kind === 'link' ? 'PAGE' : (isPdf ? 'PDF' : 'DOC'), flPick(m, 'title'));
    if (m.indexed !== false) {
      try {
        var doc = await api.materialArticles(courseId, m.id);
        if (doc && doc.articles && doc.articles.length > 1) { readerArticles(m, courseId, doc.articles, opts.article); return; }
      } catch (e) { /* fall back to the original */ }
    }
    await openOriginal(m, courseId);
  }

  function readerArticles(m, courseId, arts, target) {
    var rtl = arts.some(function (a) { return /[؀-ۿ]/.test(a.label + ' ' + a.body.slice(0, 300)); });
    var hit = -1;
    arts.forEach(function (a, i) { if (hit < 0 && target && a.label === target) hit = i; });
    $('rBody').innerHTML = '<div class="rart"' + (rtl ? ' dir="rtl" lang="ar"' : ' dir="ltr"') + ' translate="no">' +
      '<nav class="rart-nav">' + arts.map(function (a, i) {
        return '<a href="#" data-i="' + i + '"' + (i === hit ? ' class="cited"' : '') + '>' + esc(a.label) + '</a>';
      }).join('') + '</nav>' +
      '<div class="rart-body" id="rArtBody">' + arts.map(function (a, i) {
        return '<section class="rart-a' + (i === hit ? ' hl' : '') + '" id="rart-' + i + '"><h4>' + esc(a.label) +
          (i === hit ? '<span class="lib-cited">' + T('cited in the answer', 'مُستشهد بها في الإجابة') + '</span>' : '') + '</h4>' +
          '<div class="rart-t">' + esc(a.body) + '</div></section>';
      }).join('') + '</div></div>';
    var body = $('rArtBody');
    var jump = function (i) { var sec = $('rart-' + i); if (sec) body.scrollTop = sec.offsetTop - body.offsetTop - 10; };
    $('rBody').querySelectorAll('.rart-nav a').forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); jump(Number(a.getAttribute('data-i'))); };
    });
    if (hit >= 0) requestAnimationFrame(function () { jump(hit); });
    $('rText').style.display = 'none';
    var o = $('rOrig'); o.style.display = '';
    o.onclick = function () {
      o.style.display = 'none';
      var t = $('rText'); t.style.display = '';
      t.onclick = function () { readerArticles(m, courseId, arts, target); };
      openOriginal(m, courseId);
    };
    var q = $('rQuiz'); q.style.display = '';
    q.onclick = function () { readerQuiz(m, courseId, arts); };
  }

  async function readerQuiz(m, courseId, arts) {
    $('rQuiz').style.display = 'none'; $('rOrig').style.display = 'none';
    var t = $('rText'); t.style.display = '';
    t.onclick = function () { readerArticles(m, courseId, arts); };
    $('rBody').innerHTML = '<div class="rmsg">' + T('Writing three questions on this document…', 'جارٍ إعداد ثلاثة أسئلة على هذا المستند…') + '</div>';
    var qz;
    try { qz = await api.materialQuiz(courseId, m.id, isAr() ? 'ar' : 'en'); }
    catch (e) {
      $('rBody').innerHTML = '<div class="rmsg">' + esc(/AIMODEL|configured/i.test((e && e.message) || '')
        ? T('Self-tests are not available on this server yet.', 'الاختبارات الذاتية غير متاحة على هذا الخادم بعد.')
        : T('Could not write questions on this document just now — please try again.', 'تعذّر إعداد أسئلة على هذا المستند الآن — حاول مرة أخرى.')) + '</div>';
      return;
    }
    var Q = (qz && qz.questions) || [];
    var answered = 0, right = 0;
    $('rBody').innerHTML = '<div class="rquiz"' + (isAr() ? ' dir="rtl"' : '') + '>' +
      '<h3>' + T('Test yourself', 'اختبر نفسك') + '</h3>' +
      '<p class="rq-note">' + T('Three questions from this document. Not graded — for your own practice.', 'ثلاثة أسئلة من هذا المستند. غير محتسبة — للتدرّب فقط.') + '</p>' +
      Q.map(function (q, i) {
        return '<div class="rq"><b>' + (i + 1) + '. ' + esc(q.q) + '</b>' +
          q.options.map(function (o, j) { return '<button type="button" class="rq-opt" data-q="' + i + '" data-j="' + j + '">' + esc(o) + '</button>'; }).join('') +
          '<div class="rq-why" id="rq-why-' + i + '"></div></div>';
      }).join('') + '<p class="rq-score" id="rqScore"></p></div>';
    $('rBody').querySelectorAll('.rq-opt').forEach(function (b) {
      b.onclick = function () {
        var qi = Number(b.getAttribute('data-q')), q = Q[qi];
        var ok = Number(b.getAttribute('data-j')) === q.answer;
        $('rBody').querySelectorAll('.rq-opt[data-q="' + qi + '"]').forEach(function (o) {
          o.disabled = true;
          if (Number(o.getAttribute('data-j')) === q.answer) o.classList.add('right');
        });
        if (!ok) b.classList.add('wrong'); else right++;
        answered++;
        var why = $('rq-why-' + qi);
        why.innerHTML = (ok ? T('Correct. ', 'إجابة صحيحة. ') : T('Not quite. ', 'ليس تماماً. ')) + esc(q.why || '') +
          (q.article ? ' <button type="button" class="lx-link" data-art="' + esc(q.article) + '">' + T('Read ', 'اقرأ ') + esc(q.article) + '</button>' : '');
        var link = why.querySelector('[data-art]');
        if (link) link.onclick = function () { readerArticles(m, courseId, arts, link.getAttribute('data-art')); };
        if (answered === Q.length) {
          $('rqScore').textContent = isAr() ? ('أجبت إجابة صحيحة عن ' + right + ' من ' + Q.length + '.') : ('You got ' + right + ' of ' + Q.length + ' right.');
        }
      };
    });
  }

  // The material as it was uploaded or linked: the PDF itself, the file, or the page.
  async function openOriginal(m, courseId) {
    $('rBody').innerHTML = '<div class="rmsg">' + T('Opening…', 'جارٍ الفتح…') + '</div>';
    if (m.kind === 'link') {
      $('rBody').innerHTML = '<div class="rmsg"><div>' + T('This page opens on its own site.', 'تُفتح هذه الصفحة على موقعها.') +
        '<br><br><button id="rGoLink">' + T('Open the page', 'افتح الصفحة') + '</button></div></div>';
      $('rGoLink').onclick = function () { window.open(m.url, '_blank'); };
      readerNewTab(m.url);
      return;
    }
    // A file: inline (fetch with the token) or cloud blob (short-lived URL).
    var isPdf = /pdf/i.test(m.mime || '') || /\.pdf$/i.test(m.file_name || '');
    var isText = /^text\/|json|html/i.test(m.mime || '');
    try {
      if (m.download_kind === 'blob') {
        var u = await api.materialDownloadUrl(courseId, m.id);
        if (isPdf) { readerFrame(u.url); } else { $('rBody').innerHTML = '<div class="rmsg">This file opens outside the hub.</div>'; }
        readerNewTab(u.url); readerDownload(u.url, m.file_name || m.title);
        return;
      }
      var blob = await fetchMaterialBlob(courseId, m.id);
      var typed = new Blob([blob], { type: m.mime || 'application/octet-stream' });
      var url = URL.createObjectURL(typed);
      if (isPdf) { readerFrame(url); }
      else if (isText) {
        var txt = await typed.text();
        var d = document.createElement('div'); d.className = 'rtext'; d.textContent = txt;
        $('rBody').innerHTML = ''; $('rBody').appendChild(d);
      } else {
        $('rBody').innerHTML = '<div class="rmsg">This document type doesn’t preview in the browser — use Download and open it on your device.</div>';
      }
      readerNewTab(url); readerDownload(url, m.file_name || m.title);
    } catch (e) {
      $('rBody').innerHTML = '<div class="rmsg">' + esc(e.message || 'Could not open this material.') + '</div>';
    }
  }

  // ─── SCORM, played in the hub ───────────────────────────────────
  // The backend unzips the uploaded package and serves it with a SCORM
  // runtime of its own; this page just frames the player and listens for
  // what the package reports. The attempt opened here is settled from the
  // package's own status and score — no more "tell the page when you have
  // finished it".
  async function scormPlayerUrl(courseId, mid) {
    var resp = await fetch((window.LAD_API_BASE || '') + '/api/v1/scorm/' +
      encodeURIComponent(courseId) + '/' + encodeURIComponent(mid) + '/launch',
      { method: 'POST', headers: api.getToken() ? { 'Authorization': 'Bearer ' + api.getToken() } : {} });
    var j = null; try { j = await resp.json(); } catch (e) { }
    if (!resp.ok) {
      var err = new Error((j && j.message) || 'Could not open the package (' + resp.status + ')');
      err.link = j && j.url; err.code = j && j.error; throw err;
    }
    return (window.LAD_API_BASE || '') + j.player_url;
  }

  var scormSession = null;
  var spineActs = [];
  window.addEventListener('message', async function (ev) {
    var d = ev.data && ev.data.ladScorm;
    if (!d) return;
    // A package played from the reference library has no attempt to close,
    // but the player has already saved the learner's result server-side —
    // so on finish, close the reader and redraw the library so the tick shows.
    if (!scormSession) {
      if (d.event === 'finish') { $('rBody').innerHTML = ''; try { $('reader').close(); } catch (e) { } try { await loadLibrary(); } catch (e) { } }
      return;
    }
    var apiOrigin; try { apiOrigin = new URL(window.LAD_API_BASE || location.href).origin; } catch (e) { apiOrigin = location.origin; }
    if (ev.origin !== apiOrigin) return;
    if (d.event === 'finish' && !scormSession.done) {
      scormSession.done = true;
      stopHeartbeat();
      var sess = scormSession; scormSession = null;
      try {
        await api.closeAttempt(sess.attempt.id, {
          completed: !!d.completed,
          score: d.score == null ? undefined : d.score,
          percent: d.percent == null ? null : d.percent,
          seconds: d.seconds || Math.max(5, Math.round((Date.now() - openedAt) / 1000)),
        });
      } catch (e) { /* the state is saved server-side either way */ }
      $('rBody').innerHTML = ''; try { $('reader').close(); } catch (e) { }
      note(''); await load();
    }
  });

  // ─── Keeping the record while the learner works ─────────────────
  // Someone who opens a reading and then closes the laptop used to leave an
  // attempt open forever and lose every second of it. The heartbeat banks the
  // time as it accrues, so whatever happens to the tab, the record already
  // reflects the work. It reports time only — a client is never trusted to
  // say an activity was completed.
  var beat = null;
  function elapsed() { return Math.max(0, Math.round((Date.now() - openedAt) / 1000)); }

  function sendBeat() {
    if (!openAttempt) return;
    // Fire and forget. A dropped heartbeat costs at most one interval of
    // recorded time and must never surface an error over the learner's work.
    try { api.checkpoint(openAttempt.id, { seconds: elapsed() }).catch(function () {}); }
    catch (e) { /* offline, sleeping, navigating away */ }
  }

  function startHeartbeat() {
    stopHeartbeat();
    beat = setInterval(sendBeat, 30000);
  }
  function stopHeartbeat() { if (beat) { clearInterval(beat); beat = null; } }

  // The tab going away is the case this exists for, and it is the one moment
  // no interval will fire. visibilitychange is the event that actually
  // survives a phone locking or a tab closing; pagehide covers the rest.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') sendBeat();
  });
  window.addEventListener('pagehide', sendBeat);

  // ─── Launching ──────────────────────────────────────────────────
  // The AI trainer runs its own session and the server mirrors it onto the
  // spine, so this page must NOT also open an attempt for it — that would
  // double-count. Everything else is tracked from here.
  async function launch(a) {
    if (a.kind === 'ai_lesson') {
      if (!a.lesson_id) { note('This session has no teaching material attached yet.', true); return; }
      location.href = 'trainer.html?lesson=' + encodeURIComponent(a.lesson_id) +
                      '&return=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    current = a; openedAt = Date.now(); openAttempt = null; dlgHandled = false;
    try {
      var started = await api.startActivity(a.id, {});
      openAttempt = started.attempt;
      startHeartbeat();
    } catch (e) { note('Could not start this activity: ' + esc(e.message), true); return; }

    var stepMat = flMat(a);
    var launchErr = null;
    if (a.kind === 'scorm' && stepMat) {
      try {
        var pUrl;
        try { pUrl = await scormPlayerUrl(a.course_id || TOPIC, stepMat); }
        catch (e1) {
          // This site's package is missing: the other language's, if the
          // step has one, is better than a module nobody can open.
          var other = stepMat === a.material_id ? a.material_id_ar : a.material_id;
          if (e1.code !== 'package_missing' || !other || other === stepMat) throw e1;
          pUrl = await scormPlayerUrl(a.course_id || TOPIC, other);
        }
        scormSession = { attempt: openAttempt, activity: a, done: false };
        readerShow('MODULE', flPick(a, 'title'));
        readerFrame(pUrl);
        return;
      } catch (e) { launchErr = e; }
    }
    current.launchErr = launchErr;

    // A module that cannot be played here. A link-only package opens on its
    // own site, and can be marked done; an uploaded package the player
    // refused (no SCORM manifest, a broken zip) says why, and offers nothing
    // that would only bring the learner back to this dialog.
    var broken = a.kind === 'scorm' && (!stepMat || (launchErr && !launchErr.link));
    $('dlgTitle').textContent = flPick(a, 'title');
    $('dlgBody').innerHTML = a.kind !== 'scorm'
      ? T('Opens in a new tab. Mark it done when you have read it and the time you spent is recorded.', 'يُفتح في علامة تبويب جديدة. علّمه كمكتمل بعد قراءته ليُسجَّل الوقت الذي أمضيته.')
      : broken
        ? '<b>' + T('This module cannot be played yet.', 'لا يمكن تشغيل هذه الوحدة بعد.') + '</b><br>' +
          esc(launchErr && launchErr.message ? launchErr.message : T('No package is attached to this step.', 'لا توجد حزمة مرفقة بهذه الخطوة.')) + '<br><br>' +
          T('Please let the course administrator know.', 'يُرجى إبلاغ مسؤول الدورة.')
        : T('This module opens on its own site in a new tab — mark it done here when you have finished it.', 'تُفتح هذه الوحدة على موقعها في علامة تبويب جديدة — علّمها كمكتملة هنا بعد إنهائها.');
    $('dlgGo').style.display = broken ? 'none' : '';
    $('dlgDone').style.display = broken ? 'none' : '';
    $('dlgGo').textContent = T('Open', 'افتح'); $('dlgDone').textContent = T('Mark as done', 'تعليم كمكتمل'); $('dlgClose').textContent = T('Close', 'إغلاق');
    $('dlg').showModal();
  }

  async function openMaterial() {
    if (!current) return;
    // A link-only package: straight to its own site — going through the
    // library would launch the step again and bring back this dialog.
    if (current.launchErr && current.launchErr.link) { window.open(current.launchErr.link, '_blank'); return; }
    if (current.kind === 'scorm') { note(T('This module cannot be played here.', 'لا يمكن تشغيل هذه الوحدة هنا.'), true); return; }
    var wantMat = flMat(current);
    if (!wantMat) { note('No file is attached to this item yet.', true); return; }
    // Open through the reader with the sign-in token attached — a bare tab
    // has no token, so the old direct link answered {"error":"no_access"}.
    try {
      var r = await api.listCourseMaterials(current.course_id || TOPIC);
      var m = ((r && r.materials) || []).filter(function (x) { return x.id === wantMat; })[0];
      if (m) { openReference(m, current.course_id || TOPIC); return; }
    } catch (e) { /* fall through to the direct URL */ }
    try {
      var u = await api.materialDownloadUrl(current.course_id || TOPIC, wantMat);
      if (u && u.url) { window.open(u.url, '_blank'); return; }
    } catch (e2) {}
    note('Could not open this material.', true);
  }

  // Whether this sitting has already been settled, so the dialog's own 'close'
  // event does not settle it a second time. finish() closes the dialog, which
  // fires 'close', which would otherwise abandon the attempt it just completed.
  var dlgHandled = false;

  async function finish() {
    stopHeartbeat();
    dlgHandled = true;
    if (!openAttempt) { $('dlg').close(); return; }
    var seconds = Math.max(30, elapsed());
    try {
      await api.closeAttempt(openAttempt.id, { completed: true, seconds: seconds });
      $('dlg').close(); note('');
      await load();
    } catch (e) {
      // The close failed, so nothing was settled — let the dialog's own close
      // path settle it rather than silently dropping the sitting.
      dlgHandled = false;
      note('Could not record that: ' + esc(e.message), true);
    }
  }
  async function abandon() {
    stopHeartbeat();
    dlgHandled = true;
    if (openAttempt) {
      var seconds = Math.max(5, elapsed());
      try { await api.closeAttempt(openAttempt.id, { completed: false, abandoned: true, seconds: seconds }); }
      catch (e) { /* the reaper settles it later; the heartbeat kept the time */ }
    }
    $('dlg').close();
    await load();
  }

  $('dlgGo').onclick = openMaterial;
  $('dlgDone').onclick = finish;
  $('dlgClose').onclick = abandon;
  // Escape closes a modal <dialog> natively, firing no click handler. Without
  // this the heartbeat would keep running against a sitting nobody is in,
  // booking hours that never happened onto the estate dashboard — and the
  // fresh heartbeat would keep the reaper from ever settling it.
  $('dlg').addEventListener('close', function () {
    if (dlgHandled) { dlgHandled = false; return; }
    abandon().catch(function () {});
  });

  load();
})();
</script>
</body>
</html>
