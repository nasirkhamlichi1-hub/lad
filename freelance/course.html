<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course · Freelance Lawyers Training</title>
<!--
  The course page. The author's welcome, the pathway of steps (e-learning
  modules, reference documents, AI trainer sessions) with the learner's state on
  each, and the reference library. The ring is the one honest
  number, derived on the server from the attempt log — this page never
  sends a percentage. Usage: course.html?topic=COURSE-ID
-->
<!-- Government of Dubai Legal Affairs Department identity, then the portal's own stylesheet -->
<link rel="stylesheet" href="lad-brand.css">
<link rel="stylesheet" href="fl.css">
<link rel="stylesheet" href="lad-rtl.css">
<!-- Arabic interface: direction before first paint, dictionary-driven translation, language switch -->
<script src="lad-i18n.js"></script>
<script src="lad-brand.js" defer></script>
<script src="runtime-config.js"></script>
<script src="fl-api.js"></script>
<script src="fl-shell.js" data-roles="learner"></script>
<style>
  :root {
    --ground:#F7F6F1; --surface:#FFFFFF; --alt:#EFEDE6;
    --line:#E0DDD2; --line-soft:#EAE8DF;
    --ink:#171A17; --ink2:#484D48; --ink3:#757A73;
    --green:#0F6E77; --green-deep:#0B5057; --green-soft:#E2F0F1; --green-line:#B5D8DB;
    --gold:#C7861F; --gold-soft:#FBF0DC;
    --crit:#8E3F2E; --crit-soft:#F6E4DF;
    --lock:#9A9E98;
    --hero-a:#0B2E36; --hero-b:#0F5A62; --hero-c:#0F6E77;
    --ring-track:rgba(255,255,255,.14);
    --serif:'Fraunces',Georgia,serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0F120F; --surface:#161A16; --alt:#1C211C;
      --line:#2C332C; --line-soft:#232923;
      --ink:#E8EAE6; --ink2:#B2B8B0; --ink3:#848A82;
      --green:#3FB2BB; --green-deep:#0B241A; --green-soft:#16262A; --green-line:#0F6E77;
      --gold:#D3A65A; --gold-soft:#2A2315;
      --crit:#D98B76; --crit-soft:#2B1B16;
      --lock:#6B716A;
      --hero-a:#071C21; --hero-b:#0B3C46; --hero-c:#0F6E77;
    }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--ground); color:var(--ink); padding-top:0;
    font:15.5px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:900px; margin:0 auto; padding:0 22px 72px; }

  /* ─── Hero: the journey's front door ─────────────────────────── */
  .hero {
    background:
      radial-gradient(1100px 420px at 85% -60%, rgba(157,119,20,.35), transparent 60%),
      radial-gradient(900px 500px at -10% 120%, rgba(44,55,101,.6), transparent 55%),
      linear-gradient(135deg, var(--hero-a) 0%, var(--hero-b) 55%, var(--hero-c) 100%);
    color:#fff; padding:38px 0 34px; position:relative; overflow:hidden;
  }
  /* An uploaded photo sits behind the hero, darkened just enough that the
     title and the ring stay legible over anything the admin chooses. */
  .hero.has-photo::before {
    content:''; position:absolute; inset:0; z-index:0;
    background-image:var(--hero-photo); background-size:cover; background-position:center;
  }
  .hero.has-photo::after {
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(6,26,19,.62) 0%, rgba(6,26,19,.78) 100%);
  }
  .hero .wrap { padding-bottom:0; position:relative; z-index:1; }
  a.back { font-size:13px; color:rgba(255,255,255,.75); text-decoration:none;
    display:inline-flex; align-items:center; gap:6px; margin-bottom:22px; }
  a.back:hover { color:#fff; }
  .eyebrow { font:600 10px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase;
    color:rgba(255,255,255,.55); margin-bottom:10px; }
  .hero-grid { display:flex; gap:34px; align-items:center; }
  .hero-main { flex:1; min-width:0; }
  h1 { font-family:var(--serif); font-weight:400; font-size:clamp(30px,5vw,44px);
    line-height:1.06; letter-spacing:-.015em; margin:0 0 14px; text-wrap:balance; }
  .welcome { color:rgba(255,255,255,.82); max-width:58ch; margin:0; font-size:16px; }
  .welcome.quiet { color:rgba(255,255,255,.6); font-style:italic; }

  /* the ring — the one honest number */
  .ringbox { flex:none; text-align:center; }
  .ring { width:148px; height:148px; }
  .ring circle { fill:none; stroke-width:9; }
  .ring .track { stroke:var(--ring-track); }
  .ring .fill  { stroke:url(#ringGrad); stroke-linecap:round;
    transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1); }
  .ring text { fill:#fff; font:700 30px var(--sans); }
  .ring .sub { font:600 9.5px var(--mono); fill:rgba(255,255,255,.6); letter-spacing:.08em; }
  .ringmeta { margin-top:8px; font:600 11px var(--mono); letter-spacing:.06em;
    color:rgba(255,255,255,.65); text-transform:uppercase; }

  .hero-stats { display:flex; gap:26px; margin-top:26px; flex-wrap:wrap; }
  .hstat .v { font:700 21px var(--sans); }
  .hstat .l { font:600 9.5px var(--mono); letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.55); margin-top:2px; }
  .done-banner { display:none; margin-top:22px; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:12px 18px;
    font-size:14.5px; }
  .done-banner b { color:#fff; }

  @media (max-width:640px){ .hero-grid{flex-direction:column-reverse; align-items:flex-start;} .ringbox{align-self:center;}
    .card{flex-wrap:wrap; gap:10px 12px;} .card .grow{flex-basis:100%; order:-1;} .path{padding-inline-start:44px;} .dot{inset-inline-start:-44px; width:34px; height:34px; font-size:12px;} }

  /* ─── The pathway ────────────────────────────────────────────── */
  .section-title { font-family:var(--serif); font-weight:400; font-size:24px;
    letter-spacing:-.01em; margin:38px 0 4px; }
  .gate-note { font:600 10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink3); margin:0 0 20px; }

  .path { position:relative; padding-inline-start:52px; }
  .path::before { content:''; position:absolute; inset-inline-start:19px; top:8px; bottom:8px; width:3px;
    border-radius:2px; background:var(--line); }
  .path .flow { position:absolute; inset-inline-start:19px; top:8px; width:3px; border-radius:2px;
    background:linear-gradient(180deg, var(--green), var(--green)); transition:height 1s ease; }

  .node { position:relative; margin-bottom:14px; }
  .dot { position:absolute; inset-inline-start:-52px; top:14px; width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center; font:700 14px var(--sans);
    background:var(--surface); border:3px solid var(--line); color:var(--ink3); z-index:1; }
  .node.done .dot { background:var(--green); border-color:var(--green); color:#fff; }
  .node.current .dot { border-color:var(--green); color:var(--green); box-shadow:0 0 0 6px var(--green-soft); }
  .node.locked .dot { color:var(--lock); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 6px var(--green-soft);} 50%{box-shadow:0 0 0 11px var(--green-soft);} }
  .node.current .dot { animation:pulse 2.4s ease-in-out infinite; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; display:flex; gap:16px; align-items:center; transition:border-color .15s, box-shadow .15s; }
  .node.current .card { border-color:var(--green-line); box-shadow:0 10px 26px rgba(15,110,119,.12); }
  .node.locked .card { opacity:.55; }
  .kind { font:600 9.5px var(--mono); letter-spacing:.1em; text-transform:uppercase;
    padding:5px 9px; border-radius:6px; white-space:nowrap; background:var(--alt); color:var(--ink3); }
  .kind.ai   { background:var(--green-soft); color:var(--green); }
  .kind.test { background:var(--gold-soft); color:var(--gold); }
  .grow { flex:1; min-width:0; }
  .t { font-weight:600; font-size:15.5px; }
  .m { font-size:12.5px; color:var(--ink3); margin-top:2px; font-variant-numeric:tabular-nums; }
  .continue-tag { display:none; font:700 10px var(--mono); letter-spacing:.12em; color:var(--green);
    text-transform:uppercase; margin-bottom:3px; }
  .node.current .continue-tag { display:block; }

  .pill { font:600 10px var(--mono); letter-spacing:.08em; text-transform:uppercase;
    padding:5px 10px; border-radius:99px; white-space:nowrap; }
  .s-not_started { background:var(--alt); color:var(--ink3); }
  .s-in_progress { background:var(--gold-soft); color:var(--gold); }
  .s-completed, .s-passed { background:var(--green); color:#fff; }
  .s-failed { background:var(--crit-soft); color:var(--crit); }
  .s-lock { background:transparent; color:var(--lock); border:1px dashed var(--line); }

  button { font:600 13.5px/1 var(--sans); padding:11px 16px; border-radius:8px; cursor:pointer;
    border:1px solid var(--green); background:var(--green); color:#fff; }
  button:hover { background:var(--green-deep); border-color:var(--green-deep); }
  @media (prefers-color-scheme: dark){ button{color:#0F120F;} button:hover{background:var(--green);opacity:.88;} }
  button.ghost { background:transparent; color:var(--green); }
  button.ghost:hover { background:var(--green-soft); color:var(--green); }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button:focus-visible { outline:2px solid var(--green); outline-offset:2px; }

  /* ─── The reference library ──────────────────────────────────── */
  /* A brief on each source — what it is and the
     points that matter — then the option to open the whole thing. Reading
     comes first; the document is one click behind it. */
  .sec-kicker { font:700 10px var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold); margin-bottom:9px; }
  .sec-lede { font-size:14.5px; color:var(--ink2); line-height:1.6; max-width:660px; margin-top:10px; }
  .group-label { font:700 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink3); margin:30px 0 14px; display:flex; align-items:center; gap:10px; }
  .group-label:after { content:''; flex:1; height:1px; background:var(--line); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  .law { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px 18px;
    box-shadow:0 6px 18px rgba(10,20,15,.06); position:relative; overflow:hidden;
    transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column; }
  .law:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(10,20,15,.10); }
  .law:before { content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--green); }
  .law.uae:before { background:var(--gold); }
  .law.doc:before { background:var(--ink3); }
  .law-top { display:flex; align-items:center; gap:8px; margin-bottom:11px; flex-wrap:wrap; }
  .tag { font:700 9.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:4px 9px;
    border-radius:999px; background:var(--alt); color:var(--ink3); border:1px solid var(--line); }
  .tag.yr { background:var(--green-soft); color:var(--green); border-color:var(--green-line); }
  .law.uae .tag.yr { background:var(--gold-soft); color:var(--gold); border-color:var(--line); }
  .law h3 { font-family:var(--serif); font-weight:400; font-size:21px; line-height:1.14; letter-spacing:-.01em; }
  .law-sub { font-size:12px; color:var(--ink3); font-weight:500; margin-top:3px; }
  .law p { font-size:13.5px; color:var(--ink2); line-height:1.62; margin-top:11px; }
  .law ul { list-style:none; margin-top:12px; display:flex; flex-direction:column; gap:7px; }
  .law li { font-size:12.5px; color:var(--ink2); line-height:1.5; padding-inline-start:17px; position:relative; }
  .law li:before { content:''; position:absolute; inset-inline-start:3px; top:8px; width:5px; height:5px;
    border-radius:50%; background:var(--green); opacity:.55; }
  .law .open { margin-top:auto; padding-top:15px; }
  .law .open button { font:600 12.5px var(--sans); padding:9px 15px; border-radius:8px; }

  /* ─── Q&A ───────────────────────────────────────────────────── */
  /* ─── Reference library: ask, then read ─────────────────────── */
  .lib { background:var(--alt); border-radius:14px; padding:34px 36px 30px; margin-top:8px; }
  .lib .sec-lede { margin-top:6px; margin-bottom:22px; }
  .lib-ask { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:6px 6px 6px 20px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .lib-spark { color:var(--gold); font-size:15px; flex-shrink:0; }
  .lib-ask input { flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:16.5px;
    padding:10px 0; outline:none; }
  .lib-ask input::placeholder { color:var(--ink3); }
  .lib-ask button { flex-shrink:0; border:0; border-radius:999px; background:var(--gold); color:#fff; font:600 14.5px var(--sans);
    padding:12px 24px; cursor:pointer; }
  .lib-ask button:hover { filter:brightness(.92); }
  .lib-ask button:disabled { opacity:.6; cursor:default; }
  .lib-hint { font-size:13px; color:var(--ink3); margin:10px 0 0 20px; }
  [dir="rtl"] .lib-hint { margin:10px 20px 0 0; }
  .lib-answer { margin-top:20px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px 26px; }
  .lib-answer-text { font-size:16px; line-height:1.75; color:var(--ink); margin:0; }
  .lib-answer-text.lib-busy { color:var(--ink3); }
  .lib-answer-text.lib-busy:after { content:''; display:inline-block; width:14px; height:14px; margin-inline-start:10px; vertical-align:-2px;
    border:2px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:libspin .8s linear infinite; }
  @keyframes libspin { to { transform:rotate(360deg); } }
  .lib-fn { color:var(--gold); font-weight:600; font-size:11px; margin:0 1px; cursor:pointer; }
  .lib-sources { display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center; margin-top:14px; padding-top:12px;
    border-top:1px solid var(--line-soft); font-size:13px; }
  .lib-src { color:var(--gold); font-weight:600; text-decoration:none; display:inline-flex; gap:6px; align-items:baseline; }
  .lib-src sup { font-size:10px; }
  .lib-src-art { color:var(--ink3); font-weight:500; }
  .lib-note { color:var(--ink3); margin-inline-start:auto; }
  .lib-list { margin-top:36px; }
  .lib-list-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .lib-list-head h3 { font:700 19px var(--sans); color:var(--ink); margin:0; }
  .lib-list-head span { font-size:13px; color:var(--ink3); }
  .lib-title { font-size:16.5px; line-height:1.42; font-weight:500; color:var(--ink); }
  .lib-kind { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); font-weight:600; line-height:1.4; }
  .lib-open { font-size:14px; font-weight:600; color:var(--gold); white-space:nowrap; margin-inline-start:auto; }
  .lib-arrow { display:inline-block; }
  [dir="rtl"] .lib-arrow { transform:scaleX(-1); }
  .lib-done { color:#1d8f5c; font-weight:600; }
  .lx-sum { display:block; font-size:15.5px; font-weight:600; color:var(--ink); line-height:1.45; }
  .lx-tags { display:flex; flex-wrap:wrap; gap:6px; }
  .lx-tag { display:inline-block; font-size:11.5px; font-weight:600; color:var(--ink2); background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .lx-art { display:inline-block; font-size:11.5px; font-weight:700; color:var(--gold); border:1px solid var(--gold);
    border-radius:6px; padding:1px 7px; white-space:nowrap; }
  .lx-tags .lib-cited { margin-inline-start:0; }
  .lx-tick { width:20px; height:20px; border-radius:50%; border:2px solid var(--ink3); opacity:.45; color:transparent; font-size:11px; font-weight:700; display:inline-grid; place-items:center; }
  .lx-tick.on { background:var(--green); border-color:var(--green); color:#fff; opacity:1; }
  .lx-num { width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--surface); font-size:12px; font-weight:700; display:inline-grid; place-items:center; flex-shrink:0; }
  .lx-pin { border:0; background:none; color:var(--line); font-size:18px; line-height:1; cursor:pointer; padding:2px 4px; }
  .lx-pin:hover { color:var(--ink3); }
  .lx-pin.on { color:var(--gold); }

  /* questions to try, situations, views, reading meter */
  .lx-sugs { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:14px 0 0 20px; }
  [dir="rtl"] .lx-sugs { margin:14px 20px 0 0; }
  .lx-sugs:empty { display:none; }
  .lx-sugs-label { font-size:13px; color:var(--ink3); }
  .lx-sug { font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface); border:1px dashed var(--line); border-radius:999px;
    padding:6px 13px; cursor:pointer; text-align:start; }
  .lx-sug:hover { border-color:var(--gold); border-style:solid; }
  .lx-finder { margin-top:34px; }
  .lx-finder:empty { display:none; }
  .lx-finder-head { font:700 15px var(--sans); color:var(--ink); margin-bottom:10px; }
  .lx-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .lx-chip { font:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:8px 15px; cursor:pointer; text-align:start; }
  .lx-chip:hover { border-color:var(--gold); }
  .lx-chip.on { background:var(--ink); border-color:var(--ink); color:var(--surface); }
  .lx-bar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin:10px 0 12px; }
  .lx-views { display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .lx-view { font:inherit; font-size:13px; font-weight:600; color:var(--ink2); background:none; border:0; border-radius:999px; padding:6px 14px; cursor:pointer; }
  .lx-view.on { background:var(--ink); color:var(--surface); }
  .lx-meter { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink2); }
  .lx-meter i { display:block; width:140px; height:8px; border-radius:999px; background:var(--line); overflow:hidden; }
  .lx-meter b { display:block; height:100%; background:var(--green); border-radius:999px; transition:width .3s; }
  .lx-sit-note { font-size:14px; color:var(--ink2); margin:0 0 8px; }
  .lx-link { font:inherit; font-size:14px; font-weight:600; color:var(--gold); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; }

  /* timeline and by-subject views */
  .lx-tl { position:relative; padding-inline-start:26px; }
  .lx-tl::before { content:''; position:absolute; inset-inline-start:6px; top:10px; bottom:10px; width:2px; background:var(--line); }
  .lx-tl-year { position:relative; margin-bottom:22px; }
  .lx-tl-y { font:700 22px var(--sans); color:var(--gold); margin-bottom:10px; }
  .lx-tl-y::before { content:''; position:absolute; inset-inline-start:-26px; top:9px; width:14px; height:14px; border-radius:50%;
    background:var(--surface); border:3px solid var(--gold); }
  .lx-grid, .lx-tl-items, .lx-subj-items { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
  .lx-card { display:flex; flex-direction:column; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px 14px; cursor:pointer; min-width:0; box-shadow:0 2px 12px rgba(0,0,0,.05);
    transition:border-color .2s, background .2s, opacity .2s, transform .2s, box-shadow .2s; }
  .lx-card:hover, .lx-card:focus-visible { border-color:var(--gold); outline:none; transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.08); }
  .lx-card.lib-brief { cursor:default; }
  .lx-card.lib-brief:hover { transform:none; }
  .lx-card.cited { border-color:var(--gold); background:var(--gold-soft); box-shadow:0 0 0 3px rgba(199,134,31,.15); }
  .lx-card.pinned { border-top:3px solid var(--gold); }
  .lx-card-top { display:flex; align-items:center; gap:8px; }
  .lx-year { margin-inline-start:auto; font-size:13px; color:var(--ink3); font-weight:600; }
  .lx-card-foot { display:flex; align-items:center; gap:6px; margin-top:auto; padding-top:10px; border-top:1px solid var(--line-soft); }
  .lx-ct-main { font-size:15.5px !important; color:var(--ink) !important; font-weight:600; }
  .lx-card.hl { border-color:var(--gold); background:var(--gold-soft); }
  .lx-tl.hovering .lx-card:not(.hl) { opacity:.45; }
  .lx-ct { font-size:13.5px; color:var(--ink2); line-height:1.5; }
  .lx-ct[dir="rtl"] { font-size:14.5px; }
  .lx-subjects { display:grid; gap:18px; }
  .lx-subj { padding:0; }
  .lx-subj-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .lx-subj-head h4 { margin:0; font:700 16px var(--sans); color:var(--ink); flex:1; }
  .lx-subj-head span:last-child { font-size:13px; color:var(--ink3); }
  .lx-hub { width:12px; height:12px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px var(--gold-soft); flex-shrink:0; }

  /* the law behind a step, on the path */
  .lx-steplaw { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin:8px 4px 0; font-size:12.5px; color:var(--ink3); }
  .lx-steplaw button { font:inherit; font-size:12.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:4px 10px; cursor:pointer; max-width:340px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lx-steplaw button:hover { border-color:var(--gold); }
  .lx-steplaw button::before { content:'§ '; color:var(--gold); font-weight:700; }
  .lib-title { font-size:16.5px; line-height:1.42; font-weight:500; color:var(--ink); }
  .lib-cited { display:inline-block; font-size:11px; font-weight:600; color:var(--gold); background:var(--gold-soft);
    border-radius:999px; padding:2px 8px; margin-inline-start:10px; vertical-align:2px; white-space:nowrap; }
  @media (max-width:720px) {
    .lib { padding:22px 18px 20px; }
    .lx-grid, .lx-tl-items, .lx-subj-items { grid-template-columns:1fr; }
    .lx-meter i { width:90px; }
    .lx-sugs { margin-inline:0; }
      .lib-ask { padding-inline-start:14px; }
    .lib-ask button { padding:10px 16px; }
  }
  .qa-wrap { display:flex; flex-direction:column; gap:10px; max-width:820px; }
  .qa { background:var(--surface); border:1px solid var(--line); border-radius:11px; overflow:hidden; }
  .qa summary { cursor:pointer; list-style:none; padding:15px 18px; font-weight:600; font-size:14.5px;
    display:flex; align-items:flex-start; gap:12px; }
  .qa summary::-webkit-details-marker { display:none; }
  .qa-ic { flex-shrink:0; width:20px; height:20px; border-radius:6px; background:var(--green-soft);
    color:var(--green); font:700 14px/20px var(--sans); text-align:center; transition:transform .18s; }
  .qa[open] .qa-ic { transform:rotate(45deg); }
  .qa-a { padding:0 18px 16px 50px; font-size:13.5px; color:var(--ink2); line-height:1.65; }

  #reader { max-width:1060px; width:96vw; height:92vh; padding:0; overflow:hidden; display:none;
    flex-direction:column; border-radius:14px; }
  #reader[open] { display:flex; }
  .rhead { display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line); }
  .rhead .kind { flex-shrink:0; }
  .rhead .rt { font-weight:600; font-size:15px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rbody { flex:1; min-height:0; background:var(--alt); }
  .rbody iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
  .rbody .rtext { height:100%; overflow:auto; padding:34px 40px; background:var(--surface);
    font:15px/1.7 var(--sans); white-space:pre-wrap; }
  .rart { display:grid; grid-template-columns:200px minmax(0,1fr); height:100%; background:var(--surface); }
  .rart-nav { overflow:auto; border-inline-end:1px solid var(--line); padding:14px 10px; background:var(--alt); }
  .rart-nav a { display:block; padding:6px 10px; border-radius:6px; font-size:13px; color:var(--ink2); text-decoration:none; }
  .rart-nav a:hover, .rart-nav a.on { background:var(--surface); color:var(--ink); }
  .rart-nav a.cited { color:var(--gold); font-weight:700; }
  .rart-body { overflow:auto; padding:26px 34px 60px; }
  .rart-a { padding:14px 16px; border-radius:10px; margin-bottom:6px; }
  .rart-a.hl { background:var(--gold-soft); box-shadow:inset 0 0 0 2px var(--gold); }
  .rart-a h4 { margin:0 0 6px; font:700 15px var(--sans); color:var(--ink); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .rart-a h4 .lib-cited { margin:0; }
  .rart-t { font-size:15.5px; line-height:1.85; color:var(--ink); white-space:pre-wrap; }
  .rart[dir="rtl"] .rart-t { font-size:17px; }
  .rquiz { height:100%; overflow:auto; padding:28px 34px 60px; background:var(--surface); }
  .rquiz h3 { margin:0 0 4px; font:700 20px var(--sans); }
  .rquiz .rq-note { margin:0 0 18px; color:var(--ink3); font-size:13.5px; }
  .rq { margin:0 0 22px; max-width:760px; }
  .rq > b { display:block; margin-bottom:8px; font-size:15.5px; line-height:1.5; }
  .rq-opt { display:block; width:100%; text-align:start; font:inherit; font-size:15px; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:6px 0; cursor:pointer; }
  .rq-opt:hover:not(:disabled) { border-color:var(--gold); }
  .rq-opt:disabled { cursor:default; color:var(--ink); opacity:1; }
  .rq-opt.right { border-color:#1d8f5c; background:rgba(38,203,132,.12); }
  .rq-opt.wrong { border-color:#DC3131; background:rgba(220,49,49,.08); }
  .rq-why { font-size:14px; color:var(--ink2); margin-top:6px; }
  .rq-why:empty { display:none; }
  .rq-score { font:700 16px var(--sans); color:var(--ink); }
  @media (max-width:720px) {
    .rart { grid-template-columns:1fr; }
    .rart-nav { display:none; }
    .rart-body, .rquiz { padding:18px 16px 40px; }
    .rhead { flex-wrap:wrap; }
    .rhead .rt { flex-basis:100%; order:-1; }
  }
  .rbody .rmsg { height:100%; display:grid; place-items:center; color:var(--ink3); font-size:14.5px; padding:30px; text-align:center; }

  .msg { background:var(--gold-soft); border:1px solid var(--line); border-radius:10px;
    padding:14px 18px; margin:20px 0; font-size:14px; color:var(--ink2); }
  .msg.err { border-color:var(--crit); color:var(--crit); background:transparent; }
  .skel { color:var(--ink3); font-style:italic; padding:30px 0; }

  dialog { border:1px solid var(--line); border-radius:12px; background:var(--surface);
    color:var(--ink); padding:24px; max-width:430px; width:92vw; font:inherit; }
  dialog::backdrop { background:rgba(4,10,7,.55); }
  dialog h3 { margin:0 0 4px; font-size:17px; }
  dialog p { margin:0 0 14px; color:var(--ink2); font-size:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:20px; }
  @media (prefers-reduced-motion:reduce){ .ring .fill{transition:none} .node.current .dot{animation:none} .path .flow{transition:none} }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <a class="back" href="home.html">← My training</a>
    <div class="eyebrow"><span data-fl-brand>Legal Affairs Department</span> · Freelance Lawyers Training</div>
    <div class="hero-grid">
      <div class="hero-main">
        <h1 id="title">Course</h1>
        <p class="welcome quiet" id="welcome">Loading your journey…</p>
        <div class="hero-stats" id="heroStats" style="display:none">
          <div class="hstat"><div class="v" id="stDone">–</div><div class="l">Steps complete</div></div>
          <div class="hstat"><div class="v" id="stLeft">–</div><div class="l">Still to do</div></div>
          <div class="hstat"><div class="v" id="stMin">–</div><div class="l">Minutes recorded</div></div>
        </div>
        <div class="done-banner" id="doneBanner">
          <b>Course complete.</b> Every required step is done and recorded on your training record.
        </div>
      </div>
      <div class="ringbox">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Progress">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3FB2BB"/><stop offset="1" stop-color="var(--gold)"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="60" cy="60" r="52"/>
          <circle class="fill" id="ringFill" cx="60" cy="60" r="52"
                  stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 60 60)"/>
          <text id="ringPct" x="60" y="60" text-anchor="middle" dominant-baseline="central">–</text>
          <text class="sub" x="60" y="80" text-anchor="middle">COMPLETE</text>
        </svg>
        <div class="ringmeta" id="ringMeta"></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="msg"></div>
  <div id="body"><p class="skel">Loading your course…</p></div>
  <div id="library" style="display:none"></div>
</div>

<dialog id="reader">
  <div class="rhead">
    <span class="kind" id="rKind">DOC</span>
    <span class="rt" id="rTitle"></span>
    <button class="ghost" id="rText" style="display:none">Text</button>
    <button class="ghost" id="rOrig" style="display:none">Original</button>
    <button class="ghost" id="rQuiz" style="display:none">Test yourself</button>
    <button class="ghost" id="rOpen" style="display:none">Open in new tab</button>
    <button class="ghost" id="rDown" style="display:none">Download</button>
    <button class="ghost" id="rClose">Close</button>
  </div>
  <div class="rbody" id="rBody"></div>
</dialog>

<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <p id="dlgBody"></p>
  <div class="row">
    <button id="dlgGo">Open</button>
    <button class="ghost" id="dlgDone">Mark as done</button>
    <button class="ghost" id="dlgClose">Close</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var api = window.LAD;
  var TOPIC = new URLSearchParams(location.search).get('topic') || '';
  // Set by a Resume link from My Learning: the step to open on arrival.
  var RESUME = new URLSearchParams(location.search).get('resume') || '';
  var current = null, openedAt = 0, openAttempt = null;
  var $ = function (id) { return document.getElementById(id); };

  var KINDCLS = { ai_lesson:'ai', scorm:'test', assessment:'test' };
  var KINDTXT = { ai_lesson:'AI trainer', scorm:'E-learning module', document:'Reference document',
                  link:'Reading', video:'Video', assessment:'Assessment' };
  var LABEL = { not_started:'not started', in_progress:'in progress',
                completed:'completed', passed:'passed', failed:'failed' };

  function note(text, isError) {
    $('msg').innerHTML = text ? '<div class="msg' + (isError ? ' err' : '') + '">' + text + '</div>' : '';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  function metaLine(a) {
    var p = a.progress || {}, bits = [];
    if (!a.required) bits.push('optional');
    if (p.score !== null && p.score !== undefined) bits.push('score ' + p.score);
    if (a.pass_score) bits.push('pass mark ' + a.pass_score);
    if (p.total_seconds) bits.push(Math.round(p.total_seconds / 60) + ' min');
    if (p.attempt_count) bits.push(p.attempt_count + (p.attempt_count === 1 ? ' attempt' : ' attempts'));
    if (a.cpd_minutes) bits.push(a.cpd_minutes + ' min of training');
    return bits.join(' · ');
  }

  function isDone(a) { var s = (a.progress || {}).status; return s === 'completed' || s === 'passed'; }

  // ─── The hero: ring, stats, welcome ─────────────────────────────
  function renderHero(data) {
    var enr = data.enrolment;
    var first = data.sections[0] || {};
    // Topic identity comes top-level from the server, so it survives even
    // when every step is still an unpublished draft (empty sections).
    $('title').textContent = flPick(data, 'title') || flPick(first, 'title') || TOPIC;
    document.title = ($('title').textContent || 'Course') + ' · Freelance Lawyers Training';

    var w = $('welcome');
    var welcome = flPick(data, 'welcome') || flPick(first, 'welcome'), summary = flPick(data, 'summary') || flPick(first, 'summary');
    if (welcome) { w.textContent = welcome; w.classList.remove('quiet'); }
    else if (summary) { w.textContent = summary; w.classList.remove('quiet'); }
    else { w.textContent = 'Work through the steps below — your progress is recorded as you go, so you can leave and come back.'; }

    var pct = enr ? enr.percent : 0;
    var C = 326.7;
    $('ringFill').style.strokeDashoffset = String(C - (C * pct / 100));
    $('ringPct').textContent = pct + '%';
    $('ringMeta').textContent = enr
      ? (enr.required_done + ' of ' + enr.required_total + ' required')
      : 'sign in to track';

    if (enr) {
      $('heroStats').style.display = '';
      $('stDone').textContent = enr.required_done;
      $('stLeft').textContent = Math.max(0, enr.required_total - enr.required_done);
      $('stMin').textContent = Math.round((enr.total_seconds || 0) / 60);
      if (enr.status === 'completed') $('doneBanner').style.display = 'block';
    }
  }


  // ─── The pathway ────────────────────────────────────────────────
  function renderPath(data) {
    var visible = data.sections.filter(function (s) { return s.activities.length; });
    if (!visible.length) {
      $('body').innerHTML = '<p class="skel">Nothing has been published in this course yet — check back soon.' +
        (data.title ? '<br>(Building this course? Steps stay draft until each has content and you press Publish in the admin console.)' : '') + '</p>';
      return;
    }

    var currentMarked = false;
    var n = 0;
    $('body').innerHTML = visible.map(function (s, si) {
      var head = (visible.length > 1 || si > 0)
        ? '<h2 class="section-title" translate="no">' + esc(flPick(s, 'title')) + '</h2>' +
          '<p class="gate-note">' + (s.gate === 'sequential' ? 'In order — each step unlocks the next' : 'Any order') + '</p>' +
          (s.welcome && si > 0 ? '' : '')
        : '<h2 class="section-title">The pathway</h2>' +
          '<p class="gate-note">' + (s.gate === 'sequential' ? 'In order — each step unlocks the next' : 'Any order') + '</p>';
      var nodes = s.activities.map(function (a) {
        n++;
        STEP_NO[a.id] = n;
        var done = isDone(a);
        var st = (a.progress || {}).status || 'not_started';
        var cls = done ? 'done' : (a.locked ? 'locked' : '');
        if (!done && !a.locked && !currentMarked) { cls = 'current'; currentMarked = true; }
        var pill = a.locked
          ? '<span class="pill s-lock">locked</span>'
          : '<span class="pill s-' + st + '">' + LABEL[st] + '</span>';
        var btn = done ? 'Revisit' : (st === 'in_progress' ? 'Resume' : 'Start');
        return '<div class="node ' + cls + '" ' + (cls === 'current' ? 'id="currentNode"' : '') + '>' +
          '<div class="dot">' + (done ? '✓' : (a.locked ? '🔒' : n)) + '</div>' +
          '<div class="card">' +
            '<span class="kind ' + (KINDCLS[a.kind] || '') + '">' + (KINDTXT[a.kind] || a.kind) + '</span>' +
            '<div class="grow"><div class="continue-tag">Continue here</div>' +
              '<div class="t" translate="no">' + esc(flPick(a, 'title')) + '</div>' +
              '<div class="m">' + esc(metaLine(a)) + '</div></div>' +
            pill +
            '<button data-id="' + a.id + '"' + (a.locked ? ' disabled' : '') + '>' + btn + '</button>' +
          '</div></div>';
      }).join('');
      return head + '<div class="path" data-sec="' + si + '"><div class="flow"></div>' + nodes + '</div>';
    }).join('');

    // fill each section's progress line up to its last completed node
    Array.prototype.forEach.call(document.querySelectorAll('.path'), function (path) {
      var nodes = path.querySelectorAll('.node');
      var lastDone = -1;
      nodes.forEach(function (nd, i) { if (nd.classList.contains('done')) lastDone = i; });
      var flow = path.querySelector('.flow');
      if (lastDone >= 0 && nodes.length) {
        var target = nodes[lastDone];
        flow.style.height = (target.offsetTop + 34) + 'px';
      } else { flow.style.height = '0px'; }
    });

    var acts = [];
    visible.forEach(function (s) { acts = acts.concat(s.activities); });
    spineActs = acts; // the library needs these to route a package through the tracked path
    decoratePath();
    Array.prototype.forEach.call(document.querySelectorAll('[data-id]'), function (b) {
      b.onclick = function () {
        var a = acts.filter(function (x) { return x.id === b.dataset.id; })[0];
        if (a) launch(a);
      };
    });

    // Arrived from a Resume link. Scroll the step into view and open it, so
    // "pick up where you left off" lands on the actual step rather than at
    // the top of a course the learner is already halfway through. Consumed
    // once — a reload should not keep reopening the dialog.
    if (RESUME) {
      var want = acts.filter(function (x) { return x.id === RESUME; })[0];
      RESUME = '';
      if (want) {
        var el = document.querySelector('[data-id="' + (window.CSS && CSS.escape ? CSS.escape(want.id) : want.id) + '"]');
        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        launch(want);
      }
    }
  }

  async function load() {
    if (!TOPIC) {
      note('No course specified. Open this page from <a href="home.html">My training</a>.', true);
      $('body').innerHTML = '';
      return;
    }
    var data;
    try { data = await api.courseOutline(TOPIC); }
    catch (e) { note('Could not load this course: ' + esc(e.message), true); $('body').innerHTML = ''; return; }

    // The hub record carries the look (photo, accent) as well as the reference
    // library, and the look has to land before the hero paints — otherwise the
    // page flashes the default green and then re-colours itself.
    try { HUB = await api.hubGet(TOPIC); } catch (e) { HUB = null; }
    applyHubLook(HUB);

    // Enrol on first visit so progress has somewhere to land. Every course is
    // free and open to every lawyer, so opening it is joining it.
    if (!data.enrolment) {
      try { await api.enrolMe(TOPIC); data = await api.courseOutline(TOPIC); }
      catch (e) { /* anonymous preview — still render the outline */ }
    }
    renderHero(data);
    renderPath(data);
    loadLibrary();
  }

  // ─── The look of this hub ───────────────────────────────────────
  // An admin can give a course its own photo and its own colour. Everything
  // the page tints — the ring, the step markers, the buttons, the hero
  // gradient — is derived from that one accent, so a single choice re-skins
  // the hub without anyone picking six shades by hand.
  var HUB = null;
  function toRgb(h) {
    h = String(h || '').replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function toHex(c) {
    return '#' + c.map(function (v) {
      v = Math.max(0, Math.min(255, Math.round(v)));
      return ('0' + v.toString(16)).slice(-2);
    }).join('');
  }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  function applyHubLook(hub) {
    if (!hub) return;
    var root = document.documentElement;
    var hero = document.querySelector('.hero');

    var accent = String(hub.accent || '').trim();
    if (/^#[0-9a-fA-F]{6}$/.test(accent)) {
      var c = toRgb(accent);
      var dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var paper = dark ? [22, 26, 22] : [255, 255, 255];
      var ink = [0, 0, 0];
      root.style.setProperty('--green', accent);
      root.style.setProperty('--green-deep', toHex(mix(c, ink, dark ? 0.55 : 0.32)));
      root.style.setProperty('--green-soft', toHex(mix(c, paper, dark ? 0.84 : 0.89)));
      root.style.setProperty('--green-line', toHex(mix(c, paper, dark ? 0.55 : 0.62)));
      root.style.setProperty('--hero-a', toHex(mix(c, ink, 0.88)));
      root.style.setProperty('--hero-b', toHex(mix(c, ink, 0.70)));
      root.style.setProperty('--hero-c', toHex(mix(c, ink, 0.42)));
    }

    var photo = String(hub.hero_url || hub.hero_image || '').trim();
    // Only shapes the server already vetted — no quotes, brackets or scheme games.
    if (hero && photo && /^(https?:\/\/|\/)/.test(photo) && !/["'()\\<>\s]/.test(photo)) {
      hero.style.setProperty('--hero-photo', 'url(' + photo + ')');
      hero.classList.add('has-photo');
    }
  }

  // ─── The reference library ──────────────────────────────────────
  // Laws, articles, videos and source documents for this topic, presented
  // brief-first: what each source is and why it matters, with the whole
  // document one click behind it. Everything opens inside the hub.
  function ytId(u) {
    var m = String(u || '').match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    return m ? m[1] : null;
  }
  function domainOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return 'link'; } }

  // ─── Reference library: ask, then read ──────────────────────────
  // One question bar and one shelf. The answer comes only from this course's
  // documents, footnoted to the article it came from; the documents it drew
  // on rise to the top of the shelf, marked with those articles. Around the
  // shelf: a plain line under each instrument saying what it does, questions
  // to try, "what applies to me" situations that pick out the documents to
  // read in order, three ways to browse (list, timeline, by subject), the
  // learner's own reading trail (opened, pinned), and links between the
  // documents and the course steps they support. Those extras are drafted
  // by the server from the documents themselves and arrive after the list;
  // without them the shelf is simply a list. Everything renders in the
  // site's language.
  var LIB_MATS = [], LIB_LAWS = [];
  var LIB = { insights: null, reads: {}, view: 'list', situation: -1, sits: [], cited: {} };
  var STEP_NO = {};   // activity id → its number on the path
  function T(en, ar) { return (window.LAD_LANG || document.documentElement.getAttribute('lang')) === 'ar' ? ar : en; }
  function isAr() { return (window.LAD_LANG || document.documentElement.getAttribute('lang')) === 'ar'; }
  function signedIn() { return !!(api.getToken && api.getToken()); }
  function cssId(v) { return window.CSS && CSS.escape ? CSS.escape(v) : String(v).replace(/["\\]/g, '\\$&'); }

  // What kind of instrument a title names, in both languages, with a sort rank.
  function instrumentOf(m) {
    var t = (String(m.title || '') + ' ' + String(m.title_ar || '')).toLowerCase();
    var vid = m.kind === 'link' ? ytId(m.url) : null;
    if (m.kind === 'brief' && m.brief_tag) return { en: m.brief_tag, ar: m.brief_tag, rank: 45 };
    if (m.kind === 'scorm') return { en: 'E-learning module', ar: 'وحدة تعلم إلكتروني', rank: 90 };
    if (vid) return { en: 'Video', ar: 'فيديو', rank: 80 };
    if (/المجلس التنفيذي|executive council/.test(t)) return { en: 'Executive Council Resolution', ar: 'قرار المجلس التنفيذي', rank: 20 };
    if (/مرسوم|decree/.test(t)) return { en: 'Decree', ar: 'مرسوم', rank: 15 };
    if (/قانون|\blaw\b/.test(t)) return { en: 'Law', ar: 'قانون', rank: 10 };
    if (/لائحة|regulation/.test(t)) return { en: 'Regulation', ar: 'لائحة', rank: 25 };
    if (/قرار إداري|قرار اداري|administrative decision/.test(t)) return { en: 'Administrative Decision', ar: 'قرار إداري', rank: 30 };
    if (/قرار|resolution|decision/.test(t)) return { en: 'Decision', ar: 'قرار', rank: 32 };
    if (/تعميم|circular/.test(t)) return { en: 'Circular', ar: 'تعميم', rank: 35 };
    if (/دليل|guide|guidance|manual|handbook/.test(t)) return { en: 'Guidance', ar: 'دليل إرشادي', rank: 40 };
    if (m.kind === 'link') return { en: 'Web page', ar: 'صفحة ويب', rank: 60 };
    if (/pdf/i.test(m.mime || '') || /\.pdf$/i.test(m.file_name || '')) return { en: 'PDF', ar: 'ملف PDF', rank: 50 };
    return { en: 'Document', ar: 'مستند', rank: 55 };
  }
  function yearOf(m) {
    if (m.brief_year) return String(m.brief_year);
    var s = (String(m.title || '') + ' ' + String(m.title_ar || '')).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
    var y = s.match(/\b(19[5-9]\d|20[0-4]\d)\b/);
    return y ? y[1] : '';
  }

  // The knowledge hub's briefs (title, year, summary) fold into the list: a
  // brief that names a document lends it its summary; one that names nothing
  // becomes a row of its own, without an Open link.
  function libItems() {
    var norm = function (t) { return String(t || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim(); };
    var items = LIB_MATS.map(function (m) { return Object.assign({}, m); });
    LIB_LAWS.forEach(function (d) {
      var want = norm(d.title); if (!want) return;
      var hit = items.filter(function (m) { var n = norm(m.title) + ' ' + norm(m.title_ar); return n.indexOf(want) >= 0 || want.indexOf(norm(m.title)) === 0; })[0];
      if (hit) { if (!hit.description && d.summary) hit.description = d.summary; return; }
      items.push({ id: 'brief-' + norm(d.title).replace(/\s+/g, '-'), kind: 'brief', title: d.title, title_ar: null,
        description: d.summary || '', brief_tag: d.tag || '', brief_year: d.year || '' });
    });
    return items;
  }

  // What the server drafted about a document (summary, subject) — shared by
  // a document and its twin in the other language.
  function insightFor(m) {
    var I = LIB.insights;
    if (!I || !I.documents) return null;
    return I.documents[m.id] || (m.pair_id && I.documents[m.pair_id]) || null;
  }
  // One plain line saying what the document does. The author's own
  // description wins on the English site; the Arabic site prefers the
  // Arabic draft, since descriptions are usually written in English.
  function summaryOf(m) {
    var d = insightFor(m);
    if (isAr()) return (d && d.summary_ar) || m.description || (d && d.summary_en) || '';
    return m.description || (d && (d.summary_en || d.summary_ar)) || '';
  }
  function subjectOf(m) {
    var d = insightFor(m);
    if (!d || !d.subject) return null;
    return (LIB.insights.subjects || []).filter(function (s) { return s.key === d.subject; })[0] || null;
  }
  function subjectName(s) { return s ? (isAr() ? (s.ar || s.en) : (s.en || s.ar)) : ''; }
  function readOf(m) { return LIB.reads[m.id] || (m.pair_id && LIB.reads[m.pair_id]) || null; }
  function citedOf(m) { return LIB.cited[m.id] || (m.pair_id && LIB.cited[m.pair_id]) || null; }
  // The step numbers on the path that this document supports.
  function stepsFor(m) {
    var S = (LIB.insights && LIB.insights.steps) || {}, out = [];
    Object.keys(S).forEach(function (aid) {
      if (STEP_NO[aid] && S[aid].some(function (id) { return id === m.id || (m.pair_id && id === m.pair_id); })) out.push(STEP_NO[aid]);
    });
    return out.sort(function (a, b) { return a - b; });
  }
  // A material id from the server, resolved to the row shown on this site.
  function findItem(items, id) {
    return items.filter(function (x) { return x.id === id || (x.pair_id && x.pair_id === id); })[0] || null;
  }

  function titleBits(m) {
    var title = flPick(m, 'title') || m.file_name || '';
    return { text: title, dir: /[؀-ۿ]/.test(title) ? ' dir="rtl" lang="ar"' : ' dir="ltr"' };
  }

  // One card per document, in every view: what kind of instrument it is and
  // its year, a plain line saying what it does, the official title, then
  // what links it to the rest of the page (the articles an answer cited, the
  // steps it supports, its subject), and the learner's own marks on it.
  function libCard(m, o) {
    o = o || {};
    var kind = instrumentOf(m);
    var t = titleBits(m);
    var s = subjectOf(m);
    var sum = summaryOf(m);
    var year = yearOf(m);
    var brief = m.kind === 'brief';
    var done = m.learner && m.learner.completed;
    var rd = readOf(m);
    var opened = !!(rd && rd.opened);
    var pinned = !!(rd && rd.pinned);
    var meta = m.kind === 'scorm'
      ? (done ? (m.learner.score != null ? esc(String(m.learner.score)) + '%' : '✓') : '')
      : esc(year);
    var action = brief ? '' : (m.kind === 'scorm' ? (done ? T('Review', 'مراجعة') : T('Start', 'ابدأ')) : T('Open', 'افتح'));
    var tags = (o.arts || []).map(function (a) { return '<span class="lx-art" translate="no">' + esc(a) + '</span>'; }).join('') +
      (o.cited ? '<span class="lib-cited">' + T('cited above', 'مُستشهد به أعلاه') + '</span>' : '') +
      (brief ? [] : stepsFor(m)).map(function (n) { return '<span class="lx-tag">' + T('Used in step ', 'تُستخدم في الخطوة ') + n + '</span>'; }).join('') +
      (s && LIB.view !== 'subject' ? '<span class="lx-tag">' + esc(subjectName(s)) + '</span>' : '');
    var mine = brief || !signedIn() ? '' :
      '<span class="lx-tick' + (opened ? ' on' : '') + '" title="' + (opened ? T('You have opened this', 'فتحت هذا المستند') : T('Not opened yet', 'لم يُفتح بعد')) + '">✓</span>' +
      '<button type="button" class="lx-pin' + (pinned ? ' on' : '') + '" data-pin="' + esc(m.id) + '" aria-pressed="' + pinned + '" title="' +
        (pinned ? T('Unpin', 'إلغاء التثبيت') : T('Pin to the top', 'ثبّت في الأعلى')) + '">★</button>';
    return '<div class="lx-card' + (o.cited ? ' cited' : '') + (pinned ? ' pinned' : '') + (brief ? ' lib-brief' : '') + '" data-mid="' + esc(m.id) +
        '" data-subject="' + esc(s ? s.key : '') + '"' + (brief ? '' : ' role="button" tabindex="0"') + '>' +
      '<div class="lx-card-top">' + (o.step ? '<span class="lx-num">' + o.step + '</span>' : '') +
        '<span class="lib-kind">' + esc(isAr() ? kind.ar : kind.en) + '</span>' +
        (meta ? '<span class="lx-year' + (done ? ' lib-done' : '') + '">' + meta + '</span>' : '') + '</div>' +
      (sum ? '<span class="lx-sum">' + esc(sum) + '</span>' : '') +
      '<span class="lx-ct' + (sum ? '' : ' lx-ct-main') + '" translate="no"' + t.dir + '>' + esc(t.text) + '</span>' +
      (tags ? '<span class="lx-tags">' + tags + '</span>' : '') +
      '<div class="lx-card-foot">' + mine + '<span class="lib-open">' + (action ? action + ' <span class="lib-arrow">→</span>' : '') + '</span></div>' +
    '</div>';
  }

  function sortedItems() {
    return libItems().sort(function (a, b) {
      var ra = instrumentOf(a).rank, rb = instrumentOf(b).rank;
      if (ra !== rb) return ra - rb;
      return (yearOf(a) || '9999').localeCompare(yearOf(b) || '9999');
    });
  }
  function rowOpts(m) { var c = citedOf(m); return { cited: !!c, arts: c || [] }; }

  function listBody(items) {
    // Cited first, in the order the answer cited them; then pinned; then the rest.
    var order = function (m) {
      var c = citedOf(m);
      if (c) return c.order;
      var r = readOf(m);
      return r && r.pinned ? 1000 : 2000;
    };
    var list = items.map(function (m, i) { return { m: m, i: i }; })
      .sort(function (a, b) { return (order(a.m) - order(b.m)) || (a.i - b.i); })
      .map(function (x) { return x.m; });
    return '<div class="lx-grid">' + list.map(function (m) { return libCard(m, rowOpts(m)); }).join('') + '</div>';
  }

  function timelineBody(items) {
    var by = {}, years = [];
    items.forEach(function (m) { var y = yearOf(m) || ''; if (!by[y]) { by[y] = []; years.push(y); } by[y].push(m); });
    years.sort(function (a, b) { return (a || '9999').localeCompare(b || '9999'); });
    return '<div class="lx-tl" id="lx-tl">' + years.map(function (y) {
      return '<div class="lx-tl-year"><div class="lx-tl-y">' + (y ? esc(y) : T('Undated', 'بلا تاريخ')) + '</div>' +
        '<div class="lx-tl-items">' + by[y].map(function (m) { return libCard(m, rowOpts(m)); }).join('') + '</div></div>';
    }).join('') + '</div>';
  }

  function subjectBody(items) {
    var groups = (LIB.insights.subjects || []).map(function (s) {
      return { s: s, items: items.filter(function (m) { var x = subjectOf(m); return x && x.key === s.key; }) };
    }).filter(function (g) { return g.items.length; });
    var rest = items.filter(function (m) { return !subjectOf(m); });
    if (rest.length) groups.push({ s: { key: '', en: 'Other material', ar: 'مواد أخرى' }, items: rest });
    return '<div class="lx-subjects">' + groups.map(function (g) {
      return '<section class="lx-subj"><div class="lx-subj-head"><span class="lx-hub"></span><h4>' + esc(subjectName(g.s)) + '</h4><span>' + g.items.length + '</span></div>' +
        '<div class="lx-subj-items">' + g.items.map(function (m) { return libCard(m, rowOpts(m)); }).join('') + '</div></section>';
    }).join('') + '</div>';
  }

  function situationBody(items) {
    var s = LIB.sits[LIB.situation];
    var seen = {}, list = [];
    s.documents.forEach(function (id) { var m = findItem(items, id); if (m && !seen[m.id]) { seen[m.id] = 1; list.push(m); } });
    return '<p class="lx-sit-note">' + T('Read these in this order.', 'اقرأ هذه المستندات بهذا الترتيب.') +
      ' <button type="button" class="lx-link" id="lx-all">' + T('Show all documents', 'اعرض كل المستندات') + '</button></p>' +
      '<div class="lx-grid">' + list.map(function (m, i) { var o = rowOpts(m); o.step = i + 1; return libCard(m, o); }).join('') + '</div>';
  }

  function renderLibList() {
    var host = $('lib-list');
    if (!host) return;
    var items = sortedItems();
    var docs = items.filter(function (m) { return m.kind !== 'scorm'; }).length;
    var mods = items.length - docs;
    var count = isAr()
      ? (docs + ' ' + (docs === 1 ? 'مستند' : 'مستندات') + (mods ? ' · ' + mods + ' ' + (mods === 1 ? 'وحدة' : 'وحدات') : ''))
      : (docs + ' ' + (docs === 1 ? 'document' : 'documents') + (mods ? ' · ' + mods + ' ' + (mods === 1 ? 'module' : 'modules') : ''));
    var I = LIB.insights;
    var views = [['list', T('List', 'قائمة')], ['timeline', T('Timeline', 'خط زمني')]];
    if (I && I.subjects && I.subjects.length > 1) views.push(['subject', T('By subject', 'حسب الموضوع')]);
    if (!views.some(function (v) { return v[0] === LIB.view; })) LIB.view = 'list';
    var readable = items.filter(function (m) { return m.kind !== 'brief'; });
    var opened = readable.filter(function (m) { var r = readOf(m); return r && r.opened; }).length;
    var meter = signedIn() && readable.length
      ? '<div class="lx-meter"><span>' + (isAr() ? ('فتحت ' + opened + ' من ' + readable.length) : (opened + ' of ' + readable.length + ' opened')) + '</span>' +
        '<i><b style="width:' + Math.round(opened / readable.length * 100) + '%"></b></i></div>'
      : '<span></span>';
    var inSituation = LIB.situation >= 0 && LIB.sits[LIB.situation];
    var head = '<div class="lib-list-head"><h3>' + T('In this course', 'في هذه الدورة') + '</h3><span>' + count + '</span></div>' +
      '<div class="lx-bar">' + (inSituation ? '<span></span>' :
        '<div class="lx-views" role="group" aria-label="' + T('View', 'العرض') + '">' + views.map(function (v) {
          return '<button type="button" class="lx-view' + (LIB.view === v[0] ? ' on' : '') + '" data-view="' + v[0] + '" aria-pressed="' + (LIB.view === v[0]) + '">' + v[1] + '</button>';
        }).join('') + '</div>') + meter + '</div>';
    var body = inSituation ? situationBody(items)
      : LIB.view === 'timeline' ? timelineBody(items)
      : LIB.view === 'subject' ? subjectBody(items)
      : listBody(items);
    host.innerHTML = head + body;

    host.querySelectorAll('.lx-card').forEach(function (n) {
      var mid = n.getAttribute('data-mid');
      var m = LIB_MATS.filter(function (x) { return x.id === mid; })[0];
      if (!m) return;
      var go = function () { var c = citedOf(m); openReference(m, null, { article: c && c[0] }); };
      n.onclick = function (e) { if (e.target.closest('.lx-pin')) return; go(); };
      n.onkeydown = function (e) { if (e.target !== n) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
    host.querySelectorAll('.lx-pin').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var mid = b.getAttribute('data-pin');
        var on = b.getAttribute('aria-pressed') !== 'true';
        LIB.reads[mid] = Object.assign({}, LIB.reads[mid] || { opened: false }, { pinned: on });
        renderLibList();
        api.pinMaterial(TOPIC, mid, on).then(function (r) { if (r) LIB.reads[mid] = r; }).catch(function () {
          LIB.reads[mid].pinned = !on; renderLibList();
        });
      };
    });
    host.querySelectorAll('.lx-view').forEach(function (b) {
      b.onclick = function () { LIB.view = b.getAttribute('data-view'); renderLibList(); };
    });
    var all = $('lx-all');
    if (all) all.onclick = function () { LIB.situation = -1; renderFinder(); renderLibList(); };
    // Timeline: hovering a document lights up the others on the same subject.
    var tl = $('lx-tl');
    if (tl) tl.querySelectorAll('.lx-card').forEach(function (c) {
      c.onmouseenter = function () {
        var k = c.getAttribute('data-subject');
        if (!k) return;
        tl.classList.add('hovering');
        tl.querySelectorAll('.lx-card').forEach(function (o) { o.classList.toggle('hl', o.getAttribute('data-subject') === k); });
      };
      c.onmouseleave = function () { tl.classList.remove('hovering'); tl.querySelectorAll('.lx-card').forEach(function (o) { o.classList.remove('hl'); }); };
    });
  }

  // "What applies to me?" — a situation picks out the documents to read, in order.
  function renderFinder() {
    var box = $('lx-finder');
    if (!box) return;
    var items = libItems();
    var S = (LIB.insights && LIB.insights.situations) || [];
    LIB.sits = S.filter(function (s) { return (s.documents || []).some(function (id) { return findItem(items, id); }); });
    if (LIB.situation >= LIB.sits.length) LIB.situation = -1;
    if (!LIB.sits.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="lx-finder-head">' + T('What applies to me?', 'ما الذي ينطبق عليّ؟') + '</div>' +
      '<div class="lx-chips">' + LIB.sits.map(function (s, i) {
        return '<button type="button" class="lx-chip' + (LIB.situation === i ? ' on' : '') + '" data-sit="' + i + '" aria-pressed="' + (LIB.situation === i) + '">' +
          esc(isAr() ? (s.ar || s.en) : (s.en || s.ar)) + '</button>';
      }).join('') + '</div>';
    box.querySelectorAll('.lx-chip').forEach(function (c) {
      c.onclick = function () {
        var i = Number(c.getAttribute('data-sit'));
        LIB.situation = LIB.situation === i ? -1 : i;
        renderFinder(); renderLibList();
      };
    });
  }

  // Questions worth asking, drafted from the documents — one click asks.
  function renderSuggestions() {
    var box = $('lx-sugs');
    if (!box) return;
    var Q = LIB.insights && LIB.insights.questions;
    var list = Q ? ((isAr() ? Q.ar : Q.en) || []) : [];
    if (!list.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<span class="lx-sugs-label">' + T('Try:', 'جرّب:') + '</span>' +
      list.map(function (q) { return '<button type="button" class="lx-sug">' + esc(q) + '</button>'; }).join('');
    box.querySelectorAll('.lx-sug').forEach(function (b) {
      b.onclick = function () { $('lib-q').value = b.textContent; askLibrary(); };
    });
  }

  // The documents behind each step, shown under the step on the path.
  function decoratePath() {
    document.querySelectorAll('.lx-steplaw').forEach(function (n) { n.remove(); });
    var S = LIB.insights && LIB.insights.steps;
    if (!S || !LIB_MATS.length) return;
    var items = libItems();
    Object.keys(S).forEach(function (aid) {
      var btn = document.querySelector('#body button[data-id="' + cssId(aid) + '"]');
      var node = btn && btn.closest('.node');
      if (!node) return;
      var a = spineActs.filter(function (x) { return x.id === aid; })[0];
      var mats = [];
      S[aid].forEach(function (id) {
        var m = findItem(items, id);
        if (!m || m.kind === 'scorm' || m.kind === 'brief' || mats.indexOf(m) >= 0) return;
        // A document step IS its document — it need not point at itself.
        if (a && (a.material_id === m.id || a.material_id_ar === m.id || (m.pair_id && (a.material_id === m.pair_id || a.material_id_ar === m.pair_id)))) return;
        mats.push(m);
      });
      if (!mats.length) return;
      var d = document.createElement('div');
      d.className = 'lx-steplaw';
      d.innerHTML = '<span>' + T('The law behind this step:', 'النصوص التي تستند إليها هذه الخطوة:') + '</span>' +
        mats.map(function (m) {
          var t = titleBits(m);
          return '<button type="button" data-lawmid="' + esc(m.id) + '" title="' + esc(t.text) + '">' + esc(summaryOf(m) || t.text) + '</button>';
        }).join('');
      node.appendChild(d);
      d.querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
          var m = LIB_MATS.filter(function (x) { return x.id === b.getAttribute('data-lawmid'); })[0];
          if (m) openReference(m);
        };
      });
    });
  }

  function refreshLibrary() {
    renderSuggestions(); renderFinder(); renderLibList(); decoratePath();
  }

  function renderAnswer(out, question) {
    var box = $('lib-answer');
    LIB.cited = {};
    if (!out) { box.innerHTML = ''; box.style.display = 'none'; renderLibList(); return; }
    (out.citations || []).forEach(function (c) {
      var e = LIB.cited[c.material_id] || (LIB.cited[c.material_id] = []);
      if (e.order == null) e.order = Object.keys(LIB.cited).length;
      if (c.label && e.indexOf(c.label) < 0) e.push(c.label);
    });
    var text = esc(out.answer || '').replace(/\s*\[(\d+)\]/g, function (_, n) {
      return '<sup class="lib-fn" data-n="' + n + '">' + n + '</sup>';
    });
    var srcs = (out.citations || []).map(function (c) {
      var name = (isAr() && c.title_ar) ? c.title_ar : (c.title || '');
      return '<a class="lib-src" data-mid="' + esc(c.material_id) + '" data-n="' + c.n + '" href="#"><sup>' + c.n + '</sup>' +
        '<span translate="no" dir="auto">' + esc(name) + '</span>' + (c.label ? '<span class="lib-src-art">' + esc(c.label) + '</span>' : '') + '</a>';
    }).join('');
    var note = out.found
      ? T('Not legal advice — read the instruments.', 'ليست استشارة قانونية — راجع النصوص.')
      : T('The documents in this course do not answer that. Try another question, or open the instruments below.',
          'لا تجيب مستندات هذه الدورة عن هذا السؤال. جرّب سؤالاً آخر أو افتح النصوص أدناه.');
    box.innerHTML = '<p class="lib-answer-text"' + (isAr() ? ' dir="rtl"' : '') + '>' + (out.found ? text : esc(out.answer || '')) + '</p>' +
      '<div class="lib-sources">' + srcs + '<span class="lib-note">' + note + '</span></div>';
    box.style.display = 'block';
    box.querySelectorAll('.lib-src, .lib-fn').forEach(function (n) {
      n.onclick = function (e) {
        e.preventDefault();
        var c = (out.citations || []).filter(function (x) { return String(x.n) === n.getAttribute('data-n'); })[0];
        var mid = n.getAttribute('data-mid') || (c && c.material_id);
        var m = LIB_MATS.filter(function (x) { return x.id === mid || x.pair_id === mid; })[0];
        if (m) openReference(m, null, { article: c && c.label });
      };
    });
    // The sources rise to the top of the list, so show the list.
    if (out.found) { LIB.situation = -1; LIB.view = 'list'; renderFinder(); }
    renderLibList();
  }

  async function askLibrary() {
    var input = $('lib-q'), btn = $('lib-ask');
    var q = (input.value || '').trim();
    if (q.length < 3) { input.focus(); return; }
    btn.disabled = true; input.disabled = true;
    var box = $('lib-answer');
    box.style.display = 'block';
    box.innerHTML = '<p class="lib-answer-text lib-busy">' + T('Reading the documents…', 'جارٍ قراءة المستندات…') + '</p>';
    try {
      var out = await api.askLibrary(TOPIC, { question: q, lang: isAr() ? 'ar' : 'en' });
      renderAnswer(out, q);
    } catch (e) {
      var msg = (e && e.message) || '';
      var friendly = /AIMODEL|configured/i.test(msg)
        ? T('The library cannot answer questions on this server yet.', 'لا يمكن للمكتبة الإجابة عن الأسئلة على هذا الخادم بعد.')
        : T('Could not answer that just now — please try again.', 'تعذّر الحصول على إجابة الآن — حاول مرة أخرى.');
      box.innerHTML = '<p class="lib-answer-text">' + esc(friendly) + '</p>';
    } finally { btn.disabled = false; input.disabled = false; }
  }

  // The drafted extras arrive after the list. A first visit to a course
  // starts the draft on the server; the page checks back until it lands.
  async function loadInsights(tries) {
    tries = tries || 0;
    var I = null;
    try { I = await api.libraryInsights(TOPIC); } catch (e) { return; }
    if (!I || !I.available) return;
    if (I.documents) { LIB.insights = I; refreshLibrary(); }
    if ((I.pending || I.stale) && tries < 15) setTimeout(function () { loadInsights(tries + 1); }, 6000);
  }
  async function loadReads() {
    if (!signedIn()) return;
    try { var r = await api.libraryReads(TOPIC); LIB.reads = (r && r.reads) || {}; renderLibList(); } catch (e) { /* not signed in for this course */ }
  }
  // Opening a document is remembered for the learner's own trail.
  function noteRead(m, courseId) {
    if (!signedIn() || !m || m.kind === 'brief' || (courseId && courseId !== TOPIC)) return;
    if (!LIB_MATS.some(function (x) { return x.id === m.id; })) return;
    LIB.reads[m.id] = Object.assign({}, LIB.reads[m.id] || { pinned: false }, { opened: true });
    renderLibList();
    api.markMaterialRead(TOPIC, m.id).then(function (r) { if (r) { LIB.reads[m.id] = r; renderLibList(); } }).catch(function () {});
  }

  async function loadLibrary() {
    var box = $('library');
    var mats = [];
    try { var r = await api.listCourseMaterials(TOPIC); mats = (r && r.materials) || []; }
    catch (e) { /* anonymous preview, or no access yet */ }
    // A paired item exists once per language — keep the row for this site.
    var allMats = mats;
    // E-learning packages are course steps, uploaded through the step's own
    // "Upload module" — they belong on the pathway, not on the shelf.
    LIB_MATS = mats.filter(function (m) { return m.kind !== 'scorm' && flMatVisible(m, allMats); });
    LIB_LAWS = (HUB && HUB.legislation) || [];
    var faq = (HUB && HUB.faq) || [];
    if (!LIB_MATS.length && !faq.length) { box.style.display = 'none'; return; }

    var html = '';
    if (LIB_MATS.length) {
      html += '<div class="lib">' +
        '<div class="sec-kicker">' + T('Reference library', 'المكتبة المرجعية') + '</div>' +
        '<h2 class="section-title" style="margin-top:0">' + T('Documents and reference material', 'المستندات والمواد المرجعية') + '</h2>' +
        '<p class="sec-lede">' + T('Ask a question, or open any instrument in full.', 'اطرح سؤالاً، أو افتح أي نص كاملاً.') + '</p>' +
        '<form class="lib-ask" id="lib-form"><span class="lib-spark">✦</span>' +
          '<input id="lib-q" type="text" autocomplete="off" maxlength="500" placeholder="' +
            T("Ask anything about this course's laws — in Arabic or English", 'اسأل أي شيء عن قوانين هذه الدورة — بالعربية أو الإنجليزية') + '">' +
          '<button type="submit" id="lib-ask">' + T('Ask', 'اسأل') + '</button></form>' +
        '<div class="lib-hint">' + T('Answers come only from the documents below, and cite the article they came from.',
                                      'تأتي الإجابات من المستندات أدناه فقط، مع الإشارة إلى المادة التي أُخذت منها.') + '</div>' +
        '<div class="lx-sugs" id="lx-sugs"></div>' +
        '<div class="lib-answer" id="lib-answer" style="display:none"></div>' +
        '<div class="lx-finder" id="lx-finder"></div>' +
        '<div class="lib-list" id="lib-list"></div>' +
      '</div>';
    }
    if (faq.length) {
      html += '<div class="sec-kicker" style="margin-top:44px">' + T('Frequently asked', 'الأسئلة الشائعة') + '</div>' +
        '<h2 class="section-title" style="margin-top:0">' + T('Quick answers', 'إجابات سريعة') + '</h2>' +
        '<div class="qa-wrap" style="margin-top:18px">' + faq.map(function (q) {
          return '<details class="qa"><summary><span class="qa-ic">+</span><span>' + esc(q.q) + '</span></summary>' +
            '<div class="qa-a">' + esc(q.a) + '</div></details>';
        }).join('') + '</div>';
    }
    box.innerHTML = html;
    box.style.display = 'block';
    if (LIB_MATS.length) {
      renderLibList();
      $('lib-form').onsubmit = function (e) { e.preventDefault(); askLibrary(); };
